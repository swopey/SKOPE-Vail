<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKOPE · Vail map</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css" rel="stylesheet" id="mbcss">
<style>
:root{--bg:#EBE9F4;--surf:#F6F5FA;--ink:#2E2A44;--slate:#3E4454;--mut:#7E8598;
  --dim:#9BA2B4;--rule:rgba(46,42,68,.10);--accent:#CE8B71;
  --e:#7FA277;--m:#6E8FBF;--b:#2F3441;--x:#8E94A4;--vail:#3C68AF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);font-family:'Montserrat',system-ui,sans-serif;color:var(--ink);
  overflow:hidden}
#map{position:absolute;inset:0}
.pan{position:absolute;left:14px;right:14px;top:14px;z-index:5;
  background:rgba(246,245,250,.82);border-radius:16px;padding:13px 14px 14px;
  box-shadow:0 8px 26px rgba(46,42,68,.16);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.h{font-size:10px;font-weight:800;letter-spacing:.13em;padding-left:.13em;color:var(--slate)}
.sub{margin-top:5px;font-size:10.5px;font-weight:600;line-height:1.5;color:var(--mut)}
.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
button{font-family:inherit;border:0;border-radius:11px;font-weight:800;font-size:9.5px;
  letter-spacing:.13em;padding:10px 13px 10px calc(13px + .13em);background:rgba(46,42,68,.06);
  color:var(--slate)}
button.on{background:var(--slate);color:#fff}
button.go{background:var(--accent);color:#fff}
input[type=file]{display:none}
#tok{flex:1;min-width:190px;font-family:inherit;font-size:10px;font-weight:700;
  letter-spacing:.04em;border:1px solid var(--rule);border-radius:11px;padding:10px 12px;
  background:#fff;color:var(--ink)}
.foot{position:absolute;left:14px;right:14px;bottom:14px;z-index:5;
  background:rgba(246,245,250,.82);border-radius:16px;padding:11px 14px;
  font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--mut);
  box-shadow:0 8px 26px rgba(46,42,68,.16);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.foot b{color:var(--ink)}
.leg{display:flex;gap:11px;flex-wrap:wrap;margin-top:8px;align-items:center}
.leg i{display:inline-block;width:13px;height:3px;border-radius:2px;margin-right:5px;
  vertical-align:2px}
.leg span{font-size:8.5px;font-weight:800;letter-spacing:.11em;color:var(--mut)}
.drop{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;
  background:rgba(235,233,244,.92);font-size:12px;font-weight:800;letter-spacing:.13em;
  color:var(--slate)}
.drop.on{display:flex}
</style>
</head>
<body>
<div id="map"></div>

<div class="pan">
  <div class="h">SKOPE · VAIL</div>
  <div class="sub" id="say">Drop your <b>.geojson</b> anywhere on this page, or press Load.</div>
  <div class="row" id="tokrow" style="display:none">
    <input id="tok" type="text" placeholder="PASTE YOUR MAPBOX TOKEN" autocapitalize="off"
      autocorrect="off" spellcheck="false">
    <button class="go" id="toksave">SAVE</button>
  </div>
  <div class="row">
    <button class="go" id="pick">LOAD GEOMETRY</button>
    <button id="t-terrain" class="on">TERRAIN</button>
    <button id="t-sat">SATELLITE</button>
    <button id="t-lifts" class="on">LIFTS</button>
    <button id="t-labels" class="on">LABELS</button>
  </div>
  <div class="row" id="faces"></div>
  <input type="file" id="file" accept=".geojson,.json">
</div>

<div class="foot">
  <span id="count">No geometry loaded yet.</span>
  <div class="leg">
    <span><i style="background:var(--e)"></i>EASIEST</span>
    <span><i style="background:var(--m)"></i>MORE</span>
    <span><i style="background:var(--b)"></i>MOST</span>
    <span><i style="background:var(--x)"></i>EXPERT</span>
    <span><i style="background:var(--vail)"></i>LIFT</span>
  </div>
</div>

<div class="drop" id="drop">DROP IT</div>

<script>
/* ── WHY THIS IS NOT A PLAIN <script src>. A pinned CDN version that has been
   retired fails silently and the browser says nothing but "script error",
   which tells neither of us anything. Three sources are tried in turn, and
   whatever goes wrong is printed on the page in words. */
window.onerror=function(m,src,line){
  var box=document.getElementById('say');
  if(box) box.innerHTML='<b style="color:#B4553C">'+m+'</b><br>'+
    String(src||'').split('/').pop()+(line?' line '+line:'');
  return false;
};
/* cdnjs leads because 3.17.0 is confirmed to exist there; Mapbox's own CDN
   retires versions quietly, which is what produced the first script error. */
const MBJS=['https://cdnjs.cloudflare.com/ajax/libs/mapbox-gl/3.17.0/mapbox-gl.js',
            'https://unpkg.com/mapbox-gl@3.17.0/dist/mapbox-gl.js',
            'https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js'];
const MBCSS=['https://cdnjs.cloudflare.com/ajax/libs/mapbox-gl/3.17.0/mapbox-gl.css',
             'https://unpkg.com/mapbox-gl@3.17.0/dist/mapbox-gl.css',
             'https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css'];
function need(i){
  if(window.mapboxgl) return start();
  if(i>=MBJS.length){
    document.getElementById('say').innerHTML=
      '<b style="color:#B4553C">Could not load Mapbox from any of the three sources.</b>'+
      '<br>Usually a blocked network or an ad blocker. Try another browser.';
    return;
  }
  var l=document.createElement('link'); l.rel='stylesheet'; l.href=MBCSS[i];
  document.head.appendChild(l);
  var t=document.createElement('script'); t.src=MBJS[i];
  t.onload=function(){ window.mapboxgl?start():need(i+1); };
  t.onerror=function(){ document.getElementById('say').textContent=
    'Source '+(i+1)+' did not answer. Trying the next one\u2026'; need(i+1); };
  document.head.appendChild(t);
}
/* THE TOKEN IS NOT IN THIS FILE, ON PURPOSE. GitHub's secret scanning blocks
   every upload that carries one, and it would flag this page each time. A
   Mapbox pk token is a public token meant for client code, but it is still
   his account's, so it lives in his browser instead: pasted once, kept in
   localStorage, and never committed to the repo. ?token=... also works. */
const TKEY='skope-mapbox-token';
function token(){
  var u=new URLSearchParams(location.search).get('token');
  if(u){ try{ localStorage.setItem(TKEY,u); }catch(e){} return u; }
  try{ return localStorage.getItem(TKEY)||''; }catch(e){ return ''; }
}
function askToken(){
  document.getElementById('tokrow').style.display='flex';
  document.getElementById('say').innerHTML=
    'One time only: paste your Mapbox token below. It stays in this browser '+
    'and is never in the file.';
}
document.getElementById('toksave').onclick=function(){
  var v=document.getElementById('tok').value.trim();
  if(!v) return;
  try{ localStorage.setItem(TKEY,v); }catch(e){}
  location.reload();
};

function start(){
try{
var TOK=token();
if(!TOK){ askToken(); return; }
mapboxgl.accessToken=TOK;
const AREAS=[["The Front Side", ["Vail Village", "Mid-Vail", "Lionshead", "Cascade Village", "Golden Peak", "Game Creek Bowl", "Northeast Bowl"]], ["The Back Bowls", ["Sun Up Bowl", "Sun Down Bowl", "China Bowl", "Tea Cup Bowl", "Siberia Bowl", "Mongolia Bowl"]], ["Blue Sky Basin", ["Earl's Bowl", "Pete's Bowl"]]];

/* HIS LADDER, NOT OSM'S. The run colours are the same four the run by run
   uses, so a green on the map is the same green as a green chip. Roads keep
   their rating's colour and take a dash, which is the solid/dashed rule the
   chips already carry. */
const COL={easiest:'#7FA277',more:'#6E8FBF',most:'#2F3441',extreme:'#8E94A4',
  road_green:'#7FA277',road_blue:'#6E8FBF',road_black:'#2F3441',park:'#CE8B71'};
const DASHED={road_green:1,road_blue:1,road_black:1};

/* A BLANK GROUND, NOT A ROAD MAP. Mapbox's own styles draw highways and town
   labels, which is the opposite of what a ski map is for. This style is his
   pale ground plus hillshade, and nothing else. */
const STYLE_TERRAIN={version:8,
  glyphs:'mapbox://fonts/mapbox/{fontstack}/{range}.pbf',
  sources:{
    dem:{type:'raster-dem',url:'mapbox://mapbox.mapbox-terrain-dem-v1',tileSize:512,maxzoom:14},
    demshade:{type:'raster-dem',url:'mapbox://mapbox.mapbox-terrain-dem-v1',tileSize:512,maxzoom:14}
  },
  layers:[
    {id:'bg',type:'background',paint:{'background-color':'#E4E2EE'}},
    {id:'hill',type:'hillshade',source:'demshade',
     paint:{'hillshade-exaggeration':.62,
       'hillshade-shadow-color':'#8E90A8','hillshade-highlight-color':'#FFFFFF',
       'hillshade-accent-color':'#A7A9BE'}}
  ]};
const STYLE_SAT={version:8,
  glyphs:'mapbox://fonts/mapbox/{fontstack}/{range}.pbf',
  sources:{
    sat:{type:'raster',url:'mapbox://mapbox.satellite',tileSize:512},
    dem:{type:'raster-dem',url:'mapbox://mapbox.mapbox-terrain-dem-v1',tileSize:512,maxzoom:14}
  },
  layers:[{id:'sat',type:'raster',source:'sat'}]};

const map=new mapboxgl.Map({container:'map',style:STYLE_TERRAIN,
  center:[-106.355,39.612],zoom:12.3,pitch:58,bearing:8,antialias:false});
map.addControl(new mapboxgl.NavigationControl({visualizePitch:true}),'bottom-right');

let DATA=null, showLifts=true, showLabels=true, face=null;

function addTerrain(){
  if(!map.getSource('dem')) return;
  map.setTerrain({source:'dem',exaggeration:1.35});
}

function paint(){
  if(!DATA) return;
  if(map.getSource('geo')) { map.getSource('geo').setData(DATA); return; }
  map.addSource('geo',{type:'geojson',data:DATA});

  /* a soft casing under every run so a black run still reads on a dark slope */
  map.addLayer({id:'run-case',type:'line',source:'geo',
    filter:['all',['==',['get','kind'],'run']],
    layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':'rgba(255,255,255,.75)',
      'line-width':['interpolate',['linear'],['zoom'],11,2.4,15,7.5],
      'line-opacity':.55}});

  map.addLayer({id:'run',type:'line',source:'geo',
    filter:['all',['==',['get','kind'],'run'],['!',['has','dashme']]],
    layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':['match',['get','dif'],
        'easiest',COL.easiest,'more',COL.more,'most',COL.most,'extreme',COL.extreme,
        'road_green',COL.road_green,'road_blue',COL.road_blue,'road_black',COL.road_black,
        'park',COL.park,'#A9AEBA'],
      'line-width':['interpolate',['linear'],['zoom'],11,1.3,15,4.6],
      'line-opacity':.95}});

  map.addLayer({id:'road',type:'line',source:'geo',
    filter:['all',['==',['get','kind'],'run'],
      ['in',['get','dif'],['literal',['road_green','road_blue','road_black']]]],
    layout:{'line-cap':'butt','line-join':'round'},
    paint:{'line-color':['match',['get','dif'],
        'road_green',COL.road_green,'road_blue',COL.road_blue,'road_black',COL.road_black,'#A9AEBA'],
      'line-width':['interpolate',['linear'],['zoom'],11,1.3,15,4.6],
      'line-dasharray':[2,1.6],'line-opacity':.95}});

  map.addLayer({id:'lift',type:'line',source:'geo',
    filter:['==',['get','kind'],'lift'],
    layout:{'line-cap':'round'},
    paint:{'line-color':'#3C68AF','line-width':['interpolate',['linear'],['zoom'],11,1,15,2.4],
      'line-dasharray':[1,2.2],'line-opacity':.85}});

  map.addLayer({id:'run-label',type:'symbol',source:'geo',
    filter:['all',['==',['get','kind'],'run'],['has','skope']],
    layout:{'symbol-placement':'line-center','text-field':['get','skope'],
      'text-font':['DIN Pro Medium','Arial Unicode MS Regular'],
      'text-size':['interpolate',['linear'],['zoom'],12,9,15,12],
      'text-letter-spacing':.04,'text-max-angle':38},
    paint:{'text-color':'#2E2A44','text-halo-color':'rgba(255,255,255,.92)','text-halo-width':1.5}});

  map.addLayer({id:'lift-label',type:'symbol',source:'geo',
    filter:['all',['==',['get','kind'],'lift'],['has','skope']],
    layout:{'symbol-placement':'line-center','text-field':['get','skope'],
      'text-font':['DIN Pro Bold','Arial Unicode MS Bold'],
      'text-size':['interpolate',['linear'],['zoom'],12,8,15,10],
      'text-letter-spacing':.13},
    paint:{'text-color':'#3C68AF','text-halo-color':'rgba(255,255,255,.92)','text-halo-width':1.6}});

  applyFilters();
  fitTo();
  wirePopups();
}

function applyFilters(){
  ['lift','lift-label'].forEach(function(id){
    if(map.getLayer(id)) map.setLayoutProperty(id,'visibility',showLifts?'visible':'none');
  });
  ['run-label','lift-label'].forEach(function(id){
    if(map.getLayer(id)) map.setLayoutProperty(id,'visibility',
      showLabels?(id==='lift-label'&&!showLifts?'none':'visible'):'none');
  });
  const base=['==',['get','kind'],'run'];
  const f=face?['all',base,['in',face,['coalesce',['get','sides'],['literal',[]]]]]:['all',base];
  ['run-case','run'].forEach(function(id){ if(map.getLayer(id)) map.setFilter(id,f); });
  if(map.getLayer('road')) map.setFilter('road',
    face?['all',base,['in',face,['coalesce',['get','sides'],['literal',[]]]],
      ['in',['get','dif'],['literal',['road_green','road_blue','road_black']]]]
        :['all',base,['in',['get','dif'],['literal',['road_green','road_blue','road_black']]]]);
}

function fitTo(){
  let x1=180,y1=90,x2=-180,y2=-90;
  DATA.features.forEach(function(f){ f.geometry.coordinates.forEach(function(c){
    if(c[0]<x1)x1=c[0]; if(c[0]>x2)x2=c[0]; if(c[1]<y1)y1=c[1]; if(c[1]>y2)y2=c[1]; }); });
  map.fitBounds([[x1,y1],[x2,y2]],{padding:{top:150,bottom:120,left:40,right:40},duration:900});
}

function wirePopups(){
  ['run','road','lift'].forEach(function(id){
    map.on('click',id,function(e){
      const p=e.features[0].properties;
      const name=p.skope||p.osm||'(unnamed)';
      const sub=p.kind==='lift'?(p.num?p.num+' · lift':'lift')
        :[p.dif,(p.areas?JSON.parse(p.areas||'[]').join(' · '):'')].filter(Boolean).join(' · ');
      new mapboxgl.Popup({closeButton:false,offset:10})
        .setLngLat(e.lngLat)
        .setHTML('<div style="font-family:Montserrat;font-size:12px;font-weight:800;color:#2E2A44">'+
          name+'</div><div style="font-family:Montserrat;font-size:9px;font-weight:700;'+
          'letter-spacing:.1em;color:#7E8598;margin-top:3px">'+String(sub).toUpperCase()+'</div>')
        .addTo(map);
    });
    map.on('mouseenter',id,function(){ map.getCanvas().style.cursor='pointer'; });
    map.on('mouseleave',id,function(){ map.getCanvas().style.cursor=''; });
  });
}

map.on('style.load',function(){ addTerrain(); if(DATA) paint(); });

/* MAPBOX SWALLOWS ITS OWN FAILURES INTO console.error, which on a phone is
   nowhere. A failed tile request, a token without the right scope, a retired
   tileset: all of it lands here instead, in words, on the panel. */
map.on('error',function(e){
  var m=(e&&e.error&&e.error.message)||(e&&e.message)||'unknown map error';
  var s=String(m);
  if(/401|Unauthorized|not authorized/i.test(s)){
    s='Mapbox rejected that token. Check it in your Mapbox account, then clear it '+
      'with localStorage.removeItem(\'skope-mapbox-token\') and reload to paste another.';
  } else if(/can not be cloned|could not be cloned/i.test(s)){
    s='The browser blocked Mapbox\u2019s background worker. This happens inside '+
      'an in-app preview. Open the page on skope-vail.pages.dev in Safari or Chrome instead.';
  }
  document.getElementById('say').innerHTML='<b style="color:#B4553C">'+s+'</b>';
});

/* ── loading his file ─────────────────────────────────────────────────── */
function load(text){
  try{
    const j=JSON.parse(text);
    if(!j.features) throw new Error('that file has no features in it');
    DATA=j;
    const runs=j.features.filter(function(f){ return f.properties.kind==='run'; }).length;
    const lifts=j.features.length-runs;
    const named=j.features.filter(function(f){ return f.properties.skope; }).length;
    document.getElementById('count').innerHTML=
      '<b>'+j.features.length+'</b> shapes · <b>'+named+'</b> carry a SKOPE name · '+
      runs+' runs, '+lifts+' lifts';
    document.getElementById('say').textContent='Tap any run or lift to see what it is.';
    buildFaces();
    paint();
  }catch(e){ document.getElementById('say').textContent='That did not load: '+e.message; }
}
function buildFaces(){
  const box=document.getElementById('faces'); box.innerHTML='';
  const mk=function(label,val){
    const b=document.createElement('button');
    b.textContent=label; b.className=(face===val?'on':'');
    b.onclick=function(){ face=val; buildFaces(); applyFilters(); };
    box.appendChild(b);
  };
  mk('WHOLE MOUNTAIN',null);
  AREAS.forEach(function(a){ mk(a[0].replace(/^The /,'').toUpperCase(),a[0]); });
}

/* reachable from the console, which is also how it gets tested */
window.SKOPELOAD=load;
document.getElementById('pick').onclick=function(){ document.getElementById('file').click(); };
document.getElementById('file').onchange=function(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=function(){ load(r.result); }; r.readAsText(f);
};
const drop=document.getElementById('drop');
window.addEventListener('dragover',function(e){ e.preventDefault(); drop.classList.add('on'); });
window.addEventListener('dragleave',function(e){ if(e.clientX===0&&e.clientY===0) drop.classList.remove('on'); });
window.addEventListener('drop',function(e){
  e.preventDefault(); drop.classList.remove('on');
  const f=e.dataTransfer.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=function(){ load(r.result); }; r.readAsText(f);
});

document.getElementById('t-terrain').onclick=function(){
  this.classList.add('on'); document.getElementById('t-sat').classList.remove('on');
  map.setStyle(STYLE_TERRAIN);
};
document.getElementById('t-sat').onclick=function(){
  this.classList.add('on'); document.getElementById('t-terrain').classList.remove('on');
  map.setStyle(STYLE_SAT);
};
document.getElementById('t-lifts').onclick=function(){
  showLifts=!showLifts; this.classList.toggle('on',showLifts); applyFilters();
};
document.getElementById('t-labels').onclick=function(){
  showLabels=!showLabels; this.classList.toggle('on',showLabels); applyFilters();
};
buildFaces();
}catch(err){
  document.getElementById('say').innerHTML=
    '<b style="color:#B4553C">'+err.message+'</b><br>The map library loaded; this is our code.';
  throw err;
}
}
/* WebGL 2 is required by Mapbox v3. Say so plainly rather than failing blank. */
(function(){
  var c=document.createElement('canvas');
  if(!(c.getContext('webgl2'))){
    document.getElementById('say').innerHTML=
      '<b style="color:#B4553C">This browser has no WebGL 2</b>, which Mapbox needs. '+
      'Try Safari or Chrome, and check that hardware acceleration is on.';
    return;
  }
  need(0);
})();
</script>
</body></html>
