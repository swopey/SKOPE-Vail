<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SKOPE · Tag the mountain</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--slate:#3A4152;--slate2:#454D60;--accent:#E9A57F;--gold:#EBC77E;--glacier:#8FB4D8;
 --txt:#EEF1F6;--mut:#A9B3C6;--mut2:#7E8AA0;--must:#EBC77E;--down:#8FB4D8;--auto:#79C994;--adv:#C8A8E6;
 --line:#E9A57F;--bumps:#6FC7C1;--south:#F09A4B;--busy:#E96F6F;--quiet:#8FB4D8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:linear-gradient(168deg,var(--slate),var(--slate2) 62%,#4B5468);background-attachment:fixed;
 color:var(--txt);font-family:Poppins,system-ui,sans-serif;font-size:15px;line-height:1.5;padding-bottom:96px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:9;background:rgba(46,52,66,.93);backdrop-filter:blur(14px);
 margin:0 -16px;padding:14px 16px 11px;border-bottom:1px solid rgba(169,179,198,.16)}
.brand{display:flex;align-items:baseline;gap:10px;margin:0 0 3px}
.brand h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.brand span{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
.count{font-size:11.5px;color:var(--mut2);font-weight:600}
.tabs{display:flex;gap:7px;margin:11px 0 0}
.tab{flex:1;border:1px solid rgba(169,179,198,.28);background:transparent;color:var(--mut);
 border-radius:10px;padding:8px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.tab[aria-pressed="true"]{background:rgba(233,165,127,.16);border-color:var(--accent);color:var(--accent)}
input[type=search]{width:100%;margin:9px 0 0;background:rgba(46,52,66,.8);color:var(--txt);
 border:1px solid rgba(169,179,198,.28);border-radius:10px;padding:9px 11px;font:inherit;font-size:13.5px}
.filt{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0}
.fb{border:1px solid rgba(169,179,198,.26);background:transparent;color:var(--mut2);border-radius:8px;
 padding:5px 9px;font:inherit;font-size:11px;font-weight:700;cursor:pointer}
.fb[aria-pressed="true"]{color:var(--txt);border-color:var(--glacier);background:rgba(143,180,216,.14)}
h2{margin:22px 0 8px;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--mut2)}
.card{background:rgba(46,52,66,.42);border:1px solid rgba(169,179,198,.14);border-radius:14px;
 padding:12px 13px;margin:0 0 10px}
.ch{font-size:13px;font-weight:700;letter-spacing:-.01em;margin:0 0 9px;color:var(--glacier)}
.ch em{font-style:normal;color:var(--mut2);font-weight:600}
.rt{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-top:1px solid rgba(169,179,198,.1)}
.rt:first-of-type{border-top:none}
.rtx{flex:1;min-width:0}
.rtv{font-size:13px;font-weight:600;line-height:1.45;word-break:break-word}
.rtm{font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--mut2);margin-top:3px}
.tg{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;max-width:98px;justify-content:flex-end}
/* 98px holds exactly three buttons, so paths sit on one row and the six run tags
   break 3 + 3: character on top, conditions underneath. */
.t{border:1px solid rgba(169,179,198,.3);background:transparent;border-radius:7px;width:30px;height:28px;
 font:inherit;font-size:13px;font-weight:800;color:var(--mut2);cursor:pointer;line-height:1;padding:0}
.t:focus-visible{outline:2px solid var(--glacier);outline-offset:1px}
.t[data-on="1"][data-k="must"]{background:rgba(235,199,126,.2);border-color:var(--must);color:var(--must)}
.t[data-on="1"][data-k="down"]{background:rgba(143,180,216,.2);border-color:var(--down);color:var(--down)}
.t[data-on="1"][data-k="auto"]{background:rgba(121,201,148,.2);border-color:var(--auto);color:var(--auto)}
.t[data-on="1"][data-k="adv"]{background:rgba(200,168,230,.2);border-color:var(--adv);color:var(--adv)}
.t[data-on="1"][data-k="line"]{background:rgba(233,165,127,.2);border-color:var(--line);color:var(--line)}
.t[data-on="1"][data-k="bumps"]{background:rgba(111,199,193,.2);border-color:var(--bumps);color:var(--bumps)}
.t[data-on="1"][data-k="south"]{background:rgba(240,154,75,.2);border-color:var(--south);color:var(--south)}
.t[data-on="1"][data-k="busy"]{background:rgba(233,111,111,.2);border-color:var(--busy);color:var(--busy)}
.t[data-on="1"][data-k="quiet"]{background:rgba(143,180,216,.16);border-color:var(--quiet);color:var(--quiet)}
.t[data-k="line"]{font-size:17px;line-height:1}
.t[data-k="south"],.t[data-k="bumps"]{font-size:14px}
.run{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-top:1px solid rgba(169,179,198,.1)}
.run:first-of-type{border-top:none}
.rn{flex:1;min-width:0;font-size:13.5px;font-weight:600;padding-top:5px;word-break:break-word}
.rtv .nw{margin-left:8px}
.nw{font-style:normal;font-size:8.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
 color:#2B3040;background:var(--accent);border-radius:4px;padding:2px 5px;margin-left:7px;vertical-align:2px}
.dm{display:inline-block;width:9px;height:9px;margin-right:7px;vertical-align:baseline}
.d_easiest{background:#4CA96C;border-radius:50%}
.d_more{background:#5B93D6}
.d_most,.d_park{background:#E8EBF2;transform:rotate(45deg)}
.d_extreme{background:#E96F6F;transform:rotate(45deg)}
.d_road_green{border:1.6px dashed #4CA96C;border-radius:50%;background:transparent}
.d_road_blue{border:1.6px dashed #5B93D6;background:transparent}
.d_road_black{border:1.6px dashed #E8EBF2;background:transparent;transform:rotate(45deg)}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(38,43,55,.96);backdrop-filter:blur(14px);
 border-top:1px solid rgba(169,179,198,.18);padding:11px 16px calc(11px + env(safe-area-inset-bottom))}
.bari{max-width:640px;margin:0 auto;display:flex;gap:9px;align-items:center}
.tally{flex:1;font-size:11px;font-weight:700;color:var(--mut2);line-height:1.5}
.tally b{color:var(--txt)}
.exp{background:var(--accent);color:#2B3040;border:none;border-radius:10px;padding:11px 15px;
 font:inherit;font-size:13.5px;font-weight:800;cursor:pointer}
.key{display:flex;flex-wrap:wrap;gap:11px;margin:10px 0 0;font-size:10.5px;font-weight:700;color:var(--mut2)}
.key i{font-style:normal}
.empty{color:var(--mut2);text-align:center;padding:30px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(T)); }catch(e){} };
let tab='paths', q='', only=null;

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rid=(cid,i)=>cid+'#'+i;
const has=(kind,id,k)=>!!(T[kind][id]&&T[kind][id][k]);
function toggle(kind,id,k){ const b=T[kind][id]||(T[kind][id]={}); b[k]=!b[k];
  if(!b[k]) delete b[k]; if(!Object.keys(b).length) delete T[kind][id]; save(); render(); }

function tagBtns(kind,id,keys){
  return '<div class="tg">'+keys.map(k=>'<button class="t" data-kind="'+kind+'" data-id="'+esc(id)+
    '" data-k="'+k+'" data-on="'+(has(kind,id,k)?1:0)+'" title="'+k+'">'+SYM[k]+'</button>').join('')+'</div>';
}
function matches(txt){ return !q || txt.toLowerCase().indexOf(q)>=0; }

function render(){
  const app=document.getElementById('app');
  const nP=Object.keys(T.path).length, nR=Object.keys(T.run).length;
  document.getElementById('cnt').textContent=CARDS.length+' cards \u00b7 '+
    CARDS.reduce((a,c)=>a+c.r.length,0)+' route paths \u00b7 '+Object.keys(RUNS).length+' runs \u00b7 '+
    ((D.np||[]).length+(D.nw||[]).length)+' new';
  const cnt=k=>Object.keys(T.path).filter(x=>T.path[x][k]).length+Object.keys(T.run).filter(x=>T.run[x][k]).length;
  const live=(tab==='paths'?PATH_TAGS:RUN_TAGS);
  document.getElementById('tally').innerHTML=
    live.map(k=>'<b>'+cnt(k)+'</b> '+LABEL[k]).join(' \u00b7 ');
  document.getElementById('key').innerHTML=
    live.map(k=>'<i style="color:var(--'+k+')">'+SYM[k]+' '+LABEL[k]+'</i>').join('');

  document.getElementById('filt').innerHTML=
    (tab==='paths'?PATH_TAGS:RUN_TAGS).concat(['new','untagged']).map(k=>
      '<button class="fb" data-f="'+k+'" aria-pressed="'+(only===k)+'">'+
      (k==='untagged'?'untagged only':k==='new'?(tab==='runs'?'new runs':'new paths'):SYM[k]+' '+LABEL[k])+'</button>').join('');

  let h='';
  if(tab==='runs'){
    const names=Object.keys(RUNS).filter(n=>matches(n)).sort((a,b)=>a.localeCompare(b))
      .filter(n=>{ if(!only) return true; if(only==='untagged') return !T.run[n];
        if(only==='new') return (D.nw||[]).indexOf(n)>=0;
        return has('run',n,only); });
    const isNew=n=>(D.nw||[]).indexOf(n)>=0;
    const fresh=names.filter(isNew), rest=names.filter(n=>!isNew(n));
    const block=list=>'<div class="card">'+list.map(n=>
        '<div class="run"><span class="rn"><span class="dm d_'+(RUNS[n]||'more')+'"></span>'+esc(n)
        +(isNew(n)?'<i class="nw">new</i>':'')+'</span>'
        +tagBtns('run',n,RUN_TAGS)+'</div>').join('')+'</div>';
    if(!names.length) h='<p class="empty">Nothing matches.</p>';
    else{
      /* NEW FIRST. Runs added to the graph since he last tagged, so he is not
         hunting for six names inside 251. */
      if(fresh.length) h+='<h2>New since you last tagged</h2>'+block(fresh);
      if(rest.length) h+=(fresh.length?'<h2>Everything else</h2>':'')+block(rest);
    }
  } else {
    let last='';
    const shown=CARDS.map(c=>{
      const rs=c.r.map((r,i)=>({r,i})).filter(({r,i})=>{
        if(!matches(r.v+' '+c.from+' '+c.to+' '+(r.s||[]).join(' '))) return false;
        const id=rid(c.id,i);
        if(!only) return true;
        if(only==='untagged') return !T.path[id];
        if(only==='new') return (D.np||[]).indexOf(id)>=0;
        return has('path',id,only); });
      return {c,rs};
    }).filter(x=>x.rs.length);
    /* NEW FIRST, same as the runs tab: route paths that did not exist the last
       time he tagged, pulled out of their card so he is not hunting for 24
       inside 1,237. Each keeps its own card line, since a via out of context
       does not say where it starts. */
    const NP=new Set(D.np||[]);
    if(!only||only==='new'){
      const fresh=[];
      CARDS.forEach(c=>c.r.forEach((r,i)=>{ const id=rid(c.id,i);
        if(NP.has(id)&&matches(r.v+' '+c.from+' '+c.to)) fresh.push({c,r,i,id}); }));
      if(fresh.length){
        h+='<h2>New since you last tagged</h2><div class="card">';
        fresh.forEach(({c,r,i,id})=>{
          h+='<div class="rt"><div class="rtx"><div class="rtv">'+esc(r.v||'(chained only)')
            +'<i class="nw">new</i></div>'
            +'<div class="rtm">'+esc(c.from)+' \u2192 '+esc(c.to)+'</div>'
            +(r.m!=null?'<div class="rtm">'+r.m+' min</div>':'')
            +'</div>'+tagBtns('path',id,PATH_TAGS)+'</div>';
        });
        h+='</div>';
      }
      if(only==='new'){ document.getElementById('app').innerHTML=h||'<p class="empty">Nothing new.</p>';
        document.getElementById('app').querySelectorAll('.t').forEach(b=>b.onclick=()=>toggle(b.dataset.kind,b.dataset.id,b.dataset.k));
        document.getElementById('filt').querySelectorAll('.fb').forEach(b=>
          b.onclick=()=>{ only=(only===b.dataset.f)?null:b.dataset.f; render(); });
        return; }
      if(fresh.length) h+='<h2 style="margin-top:26px">Everything else</h2>';
    }
    if(!shown.length&&!h) h='<p class="empty">Nothing matches.</p>';
    shown.forEach(({c,rs})=>{
      if(c.from!==last){ h+='<h2>'+esc(c.from)+'</h2>'; last=c.from; }
      h+='<div class="card"><p class="ch">\u2192 '+esc(c.to)+' <em>'+rs.length+
         (rs.length===1?' route':' routes')+'</em></p>';
      rs.forEach(({r,i})=>{
        const id=rid(c.id,i);
        h+='<div class="rt"><div class="rtx"><div class="rtv">'+esc(r.v||'(chained only)')+'</div>'
          +((r.s&&r.s.length)?'<div class="rtm">\u29c9 '+r.s.map(esc).join(' + ')+'</div>':'')
          +(r.m!=null?'<div class="rtm">'+r.m+' min</div>':'')
          +'</div>'+tagBtns('path',id,PATH_TAGS)+'</div>';
      });
      h+='</div>';
    });
  }
  app.innerHTML=h;
  app.querySelectorAll('.t').forEach(b=>b.onclick=()=>toggle(b.dataset.kind,b.dataset.id,b.dataset.k));
  document.getElementById('filt').querySelectorAll('.fb').forEach(b=>
    b.onclick=()=>{ only=(only===b.dataset.f)?null:b.dataset.f; render(); });
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab; only=null;
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',x.dataset.tab===tab));
  render(); });
document.getElementById('q').oninput=e=>{ q=e.target.value.toLowerCase(); render(); };

/* B67. Save as a real file instead of a paste. The anchor goes in the
   document, is clicked, then removed, and the object URL is revoked on a
   timer rather than immediately, which is what breaks the download inside a
   <dialog> on iOS Safari. Copy stays as the way out if it is blocked. */
function skopeDownload(txt,name,noteId){
  var note=noteId?document.getElementById(noteId):null;
  try{
    var url=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
    var a=document.createElement('a');
    a.href=url; a.download=name; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },1500);
    if(note) note.textContent='Saved as '+name+' \u2014 look in Files, Downloads.';
    return true;
  }catch(e){
    if(note) note.textContent='This browser blocked the download. Use Copy instead.';
    return false;
  }
}
function skopeStamp(){ var d=new Date(),p=function(n){return String(n).padStart(2,'0');};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
document.getElementById('exp').onclick=()=>{
  const out=JSON.stringify({v:1,when:new Date().toISOString(),tags:T});
  const b=document.getElementById('exp');
  if(skopeDownload(out,'skope-tags-'+skopeStamp()+'.json',null)){
    b.textContent='Downloaded'; setTimeout(()=>b.textContent='Download tags',1600); return;
  }
  const ta=document.createElement('textarea'); ta.value=out; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  b.textContent='Copied'; setTimeout(()=>b.textContent='Download tags',1600);
};
render();
</script></body></html>
