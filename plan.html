<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SKOPE · Plan a day at Vail</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --slate:#3A4152; --slate2:#454D60; --ink:#2E3442;
  --accent:#E9A57F; --gold:#EBC77E; --glacier:#8FB4D8;
  --txt:#EEF1F6; --mut:#A9B3C6; --mut2:#7E8AA0;
  --green:#4CA96C; --blue:#5B93D6; --black:#E8EBF2; --dbl:#E96F6F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:linear-gradient(168deg,var(--slate) 0%,var(--slate2) 62%,#4B5468 100%);
  background-attachment:fixed;color:var(--txt);
  font-family:Poppins,system-ui,sans-serif;font-size:15px;line-height:1.5;
  padding:0 0 64px;-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:0 18px}

/* ---- masthead: the cable ---- */
header{padding:30px 0 20px;position:relative}
.brand{display:flex;align-items:baseline;gap:11px}
.brand h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.02em}
.brand span{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
.sub{margin:7px 0 0;color:var(--mut);font-size:13.5px;font-weight:500}
.cable{height:22px;margin:16px 0 0;position:relative;overflow:hidden}
.cable svg{display:block;width:100%;height:22px}

/* ---- controls ---- */
.card{background:rgba(46,52,66,.5);border:1px solid rgba(169,179,198,.16);
  border-radius:16px;padding:15px 15px 17px;margin:0 0 13px}
.lab{display:block;font-size:10.5px;font-weight:800;letter-spacing:.13em;
  text-transform:uppercase;color:var(--mut2);margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{border:1px solid rgba(169,179,198,.3);background:transparent;color:var(--mut);
  border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
  transition:.14s}
.opt:hover{border-color:rgba(233,165,127,.5)}
.opt[aria-pressed="true"]{background:rgba(233,165,127,.16);border-color:var(--accent);color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--glacier);outline-offset:2px}
.row{display:flex;gap:11px}.row>div{flex:1}
select,input[type=time]{width:100%;background:rgba(46,52,66,.75);color:var(--txt);
  border:1px solid rgba(169,179,198,.28);border-radius:10px;padding:10px 11px;
  font:inherit;font-size:14px;font-weight:600}
select:focus-visible,input:focus-visible{outline:2px solid var(--glacier);outline-offset:1px}
.go{width:100%;margin-top:4px;background:var(--accent);color:#2B3040;border:none;
  border-radius:13px;padding:15px;font:inherit;font-size:15.5px;font-weight:800;
  letter-spacing:.01em;cursor:pointer;transition:.14s}
.go:hover{filter:brightness(1.06)}.go:active{transform:scale(.985)}
.go:disabled{opacity:.5;cursor:default}

/* ---- the day ---- */
.summary{display:flex;gap:0;margin:22px 0 4px;border-radius:14px;overflow:hidden;
  border:1px solid rgba(169,179,198,.18)}
.stat{flex:1;padding:13px 8px;text-align:center;background:rgba(46,52,66,.45)}
.stat+.stat{border-left:1px solid rgba(169,179,198,.14)}
.stat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--gold)}
.stat i{display:block;font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--mut2);margin-top:3px}

.day{position:relative;margin:20px 0 0;padding-left:46px}
.day::before{content:"";position:absolute;left:19px;top:12px;bottom:12px;width:2px;
  background:linear-gradient(180deg,transparent,rgba(143,180,216,.55) 8%,rgba(143,180,216,.55) 92%,transparent)}
.stop{position:relative;margin:0 0 4px;padding:0 0 16px}
.dot{position:absolute;left:-34px;top:4px;width:15px;height:15px;border-radius:50%;
  background:var(--slate);border:2px solid var(--glacier)}
.stop.lift .dot{border-color:var(--accent);background:var(--accent)}
.stop.lift .dot::after{content:"";position:absolute;left:50%;top:-11px;width:2px;height:11px;
  background:var(--accent);transform:translateX(-50%)}
.clock{font-size:11.5px;font-weight:800;letter-spacing:.05em;color:var(--glacier)}
.stop.lift .clock{color:var(--accent)}
.what{margin:2px 0 0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.via{margin:5px 0 0;font-size:13px;color:var(--mut);line-height:1.55;font-weight:500}
.meta{margin:6px 0 0;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--mut2)}
.pill{display:inline-block;margin:0 5px 0 0;padding:2px 7px;border-radius:6px;font-size:10px;
  font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.d1{background:rgba(76,169,108,.18);color:#79C994}
.d2{background:rgba(91,147,214,.2);color:#8FB4D8}
.d3{background:rgba(232,235,242,.14);color:#D6DCE8}
.d4{background:rgba(233,111,111,.18);color:#E96F6F}
.warn{background:rgba(235,199,126,.13);border:1px solid rgba(235,199,126,.4);
  color:var(--gold);border-radius:12px;padding:12px 13px;font-size:12.5px;font-weight:600;
  line-height:1.5;margin:14px 0 0}
.empty{text-align:center;color:var(--mut);padding:34px 16px;font-size:13.5px;line-height:1.6}
.foot{margin:26px 0 0;padding-top:16px;border-top:1px solid rgba(169,179,198,.14);
  color:var(--mut2);font-size:11px;line-height:1.6;font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

const P=D.pods, TBL=D.table, BOARD=D.board, LBL=D.lbl;
const BAND=['','Green','Blue','Black','Double black'];
const hhmm=m=>{let t=Math.round(m);const h=Math.floor(t/60),x=t%60;const ap=h>=12?'pm':'am';
  const hh=h%12===0?12:h%12;return hh+':'+String(x).padStart(2,'0')+ap;};
const nname=n=>LBL[n]||n;
const podAt=n=>(BOARD[n]||[]).filter(p=>P[p]);
// where riding each lift drops you (canonical top node)
/* Canonical top node per lift, computed offline so welds, summit groups and
   download platforms all resolve to one place. */
const TOPKEY=Object.assign({},D.topOf||{});

const _g0={}; (D.groomedUsual||[]).forEach(n=>_g0[n.toLowerCase()]=1);
let S={intent:'ski',focus:{},closed:{p16:1},rare:{},spring:false,groomed:_g0,lunchAt:null,lunchMin:40,start:'p1.base',startT:9*60,endT:15*60,finish:'p1.base',
  season:'late',band:3,powder:false,plan:null,note:''};

function closeOf(p){ return P[p].close + (S.season==='late'?30:0); }
function openMtn(){ return (S.season==='late'?8.5:9)*60; }
function openBlue(){ return (S.season==='late'?9.5:10)*60; }
function daypart(t){ if(t<9.5*60)return 0; if(t<11.5*60)return 1; if(t<13*60)return 2;
  if(t<14.5*60)return 3; return 4; }
function queue(p,t){ let q=P[p].q[daypart(t)]; if(S.powder&&P[p].pow) q=Math.round(q*1.8+3); return q; }
function liftReady(p,t){ const o=(D.blue.indexOf(p)>=0)?openBlue():openMtn(); return Math.max(t,o); }

/* how few minutes from node n to the finish, ignoring queues — for the "can I get home" test */
const HOME={};
function homeTimes(fin){
  const dist={}; dist[fin]=0; let ch=true, it=0;
  while(ch&&it++<40){ ch=false;
    for(const src in TBL){ // src is a lift top
      for(const to in TBL[src]){ // landings
        let best=1e9; for(const b in TBL[src][to]){ for(const d of TBL[src][to][b]) best=Math.min(best,d[0]); }
        if(dist[to]!=null && dist[to]+best<(dist[src]??1e9)){ dist[src]=dist[to]+best; ch=true; }
      } }
    for(const n in BOARD){ for(const p of podAt(n)){ const tk=TOPKEY[p]; if(!tk) continue;
      const v=(dist[tk]??1e9)+P[p].ride+2;
      if(v<(dist[n]??1e9)){ dist[n]=v; ch=true; } } }
  }
  return dist;
}

function chainText(legs){
  const runs=[];
  legs.forEach(l=>l.split('\u2192').map(x=>x.trim()).filter(Boolean).forEach(r=>{
    if(runs.length && runs[runs.length-1]===r) return;   // same run continuing across a leg
    runs.push(r); }));
  return runs.join(' \u2192 ');
}
function descentsFrom(tk,to,maxBand){
  const bands=TBL[tk]&&TBL[tk][to]; if(!bands) return [];
  let out=[];
  for(const b in bands){ if(+b>maxBand) continue;
    for(const d of bands[b]){ const v=chainText(d[1]);
      if(hasClosedRare(v)) continue;                 /* not enough snow on it today */
      out.push({min:d[0],via:v,band:+b,road:d[2]||0,legs:d[1].length,way:(d[3]||[]).map(x=>LBL[x]||x)}); } }
  return out;
}

/* Hayden's rule: BASE LIFTS ARE FOR MOVING UP THE MOUNTAIN. Skiing base to base
   to base is not how anyone rides. Lapping your OWN base is fine when the lap is
   right (ride the Riva Bahn mid, ski Ruder's Run, ride back up; or Eagle's Nest
   and the top of #8 back down to Lionshead). What is unnatural is giving up the
   whole mountain's vertical to arrive at a village you did not start from. */
const VILLAGE={'p1.base':1,'cluster:lionshead':1,'cluster:golden_peak':1,'p20.base':1};
/* Hayden's lappability tiers. Tier 1 has fire terrain off it or is simply worth
   revisiting, so riding it again is normal, not a failure of imagination. Tier 2
   earns a second visit depending on the runs or the day. Everything else is a
   connector — riding it twice usually means the plan is going in circles. */
const LAP1={p3:1,p4:1,p5:1,p7:1,p9:1,p11:1,p17:1,p21:1,p36:1,p39:1};
const LAP2={p2:1,p6m:1,p8:1,p10:1,p14:1,p16:1,p26:1,p37:1,p38:1};
const repeatCost=p=>LAP1[p]?0.22:(LAP2[p]?0.6:1.25);
const SET=a=>{const o={};(a||[]).forEach(x=>o[x.toLowerCase()]=1);return o;};
const MUST=SET(D.must), ADV=SET(D.adv), TREE=SET(D.trees), KID=SET(D.kidzone);

const QUIETISH={}; (D.quietish||[]).forEach(p=>QUIETISH[p]=1);
/* Intents. Each is a different question, not a different setting of one question. */
const AREA=D.areaOf||{}, AREAS=D.areas||{};
/* THE SPRING CURVE. Hayden's Sun Down baseline on a bad freeze-thaw day:
   9 unskiable · 10 rough · 11 okay · 12 okay/good · 1 good · 1:30-close ideal.
   Positive = firm and unpleasant, negative = the slush everyone wants.
   Only bites from about the second week of March; winter is essentially flat. */
function firmness(t){
  if(t<10*60) return 1.00;
  if(t<11*60) return 0.72;
  if(t<12*60) return 0.40;
  if(t<13*60) return 0.24;
  if(t<13.5*60) return 0.10;
  return -0.28;
}

   ungroomed the point instead. */
/* Cat tracks and roads are a path, not a snow surface — a firm morning does not
   spoil them. Ptarmigan Ridge \u2192 O.S. \u2192 Sun Down Catwalk is the panoramic
   line out back and it is worth doing whatever the snow is doing, though Ptarmigan
   crosses a black so it wants an intermediate or better. */
const SCENIC=SET(D.scenic);
/* Forever and Sun Down Bowl are brutal on a hard firm morning — but Forever is
   iconic, and with fresh snow it is one of the best runs on the mountain. */
const BRUTAL=SET(D.brutalFirm), STAR=SET(D.starPowder);
/* Runs that need a deep snowpack and are only open for a short window — Chair 5
   Line is the lowest point on the back-bowl side and isn't even on the map. Off by
   default; tick "open today" and the planner treats them as a reason to go. */
const RARE=SET(D.rareOpen);
/* Runs that need a big snowpack and are shut most of the season. Chair 5 Line is
   the bottom pitch of High Noon, the lowest point on the back-bowl side — it is
   not on the map or the website, it just exists, and its window is short. Off by
   default; when someone reports it open it is a "go hit it today" run. */
function hasClosedRare(runsText){
  const runs=String(runsText||'').split('\u2192').map(s=>s.trim().toLowerCase()).filter(Boolean);
  return runs.some(r=>RARE[r] && !S.rareOpen[r]);
}
function rareBonus(runsText){
  const runs=String(runsText||'').split('\u2192').map(s=>s.trim().toLowerCase()).filter(Boolean);
  let n=0; runs.forEach(r=>{ if(RARE[r] && S.rareOpen[r]) n++; });
  return n*2600;
}
function conditions(runsText,lift,t){
  const runs=String(runsText||'').split('\u2192').map(s=>s.trim()).filter(Boolean);
  for(const r of runs){ if(RARE[r.toLowerCase()] && !S.rare[r.toLowerCase()]) return -1e6; }
  const raw=runs.filter(r=>{ const k=r.toLowerCase();
    if(S.groomed[k]) return false;                 /* on today's grooming report */
    if(SCENIC[k]) return false;                    /* a path down, not a snow surface */
    const d=(D.rundiff||{})[k]||'';
    if(d.indexOf('road')===0) return false;        /* cat tracks ski the same firm or soft */
    return true; });
  if(!raw.length) return 0;
  const sev=(P[lift]&&P[lift].sev)||4;
  let star=0, rare=0;
  runs.forEach(r=>{ const k=r.toLowerCase(); if(STAR[k]) star++; if(RARE[k]) rare++; });
  if(rare) return 2600*rare + star*900;            /* it's open — that's the day's news */
  if(S.powder) return raw.length*sev*120 + star*1800;   /* fresh snow — Forever is the day */
  if(!S.spring) return 0;                          /* winter: no real freeze-thaw contrast */
  /* Hayden: this is really for people who get annoyed by firm bumps and tracked-out
     snow. A stronger skier will happily take it firm, so the penalty fades with ability. */
  const tolerance = S.band>=4 ? 0.22 : (S.band===3 ? 0.5 : (S.band===2 ? 1 : 1.2));
  let harsh=1; raw.forEach(r=>{ if(BRUTAL[r.toLowerCase()]) harsh=1.7; });
  return -firmness(t)*sev*raw.length*135*tolerance*harsh;
}
function character(runsText,intent){
  const runs=String(runsText||'').split('\u2192').map(s=>s.trim().toLowerCase()).filter(Boolean);
  let must=0,adv=0,tree=0,kid=0;
  runs.forEach(r=>{ if(MUST[r])must++; if(ADV[r])adv++; if(TREE[r])tree++; if(KID[r])kid++; });
  let b=must*90;
  if(intent==='trees')   b+=tree*1100;
  if(intent==='offbeat') b+=adv*950;
  if(intent==='family')  b+=kid*700;
  if(intent==='explore') b+=(tree+adv)*120;
  if(intent==='scenic'){ let sc=0; runs.forEach(r=>{ if(SCENIC[r])sc++; }); b+=sc*1300; }
  return b;
}
/* The challenge runs against what is actually spinning today, not a fixed list.
   #16 Golden Peak counts when it is open to the public; #27 is staffing-dependent. */
function challengeSet(){ return (D.challenge||[]).filter(p=>!S.closed[p]); }
/* Minutes from any node to the place you board lift p. Lets the search see that
   Pete's is about to become unreachable long before the clock actually runs out. */
let REACH=null;
function reachTimes(){
  if(REACH) return REACH; REACH={};
  challengeSet().forEach(p=>{
    const stops=Object.keys(BOARD).filter(n=>podAt(n).indexOf(p)>=0);
    const d={}; stops.forEach(n=>d[n]=0);
    let ch=true, it=0;
    while(ch&&it++<30){ ch=false;
      for(const src in TBL){ for(const to in TBL[src]){
        let best=1e9; for(const b in TBL[src][to]) for(const x of TBL[src][to][b]) best=Math.min(best,x[0]);
        if(d[to]!=null && d[to]+best<(d[src]??1e9)){ d[src]=d[to]+best; ch=true; } } }
      for(const n in BOARD){ for(const q of podAt(n)){ const tk=TOPKEY[q]; if(!tk) continue;
        const v=(d[tk]??1e9)+P[q].ride+2; if(v<(d[n]??1e9)){ d[n]=v; ch=true; } } }
    }
    REACH[p]=d;
  });
  return REACH;
}
function build(){
  REACH=null;
  const home=homeTimes(S.finish);
  const RT=(S.intent==='challenge')?reachTimes():null;
  const beam=[{node:S.start,t:Math.max(S.startT,openMtn()),plan:[],vert:0,runs:0,seen:{},areas:{},shot:{},ate:null,score:0}];
  let best=null, W=(S.intent==='challenge'?320:90);
  for(let step=0;step<(S.intent==='challenge'?34:26);step++){
    const next=[];
    for(const st of beam){
      const h=home[st.node]; 
      const better=(a,b)=>{ if(!b) return true;
        if(S.intent==='challenge'){ const x=Object.keys(a.seen).length,y=Object.keys(b.seen).length;
          return x!==y ? x>y : a.t<b.t; }
        return a.score>b.score; };
      if(st.node===S.finish && st.plan.length && (S.lunchAt==null||st.ate) && better(st,best)) best=st;
      for(const p of podAt(st.node)){
        if(S.closed[p]) continue;
        if(S.intent==='challenge'){
          /* You only ever board a lift at its bottom, so Riva Bahn counts once —
             the mid-station is where you get OFF, not a separate lift. And a lift
             that is not on the challenge list (Wapiti, the carpets) is pure wasted
             time on a day when every minute is spoken for. */
          if(p==='p6m') continue;
          if((D.challenge||[]).indexOf(p)<0) continue;
          if(st.seen[p]) continue;
        }
        const tk=TOPKEY[p]; if(!tk) continue;
        let t0=liftReady(p,st.t); const q=queue(p,t0);
        if(t0+q>closeOf(p)) continue;                    // line closes before you'd board
        const tTop=t0+q+P[p].ride;
        for(const to in TBL[tk]){
          /* Cascade is where you start or end the day, not a place you ski to
             mid-day — UNLESS you are ticking off every lift, in which case
             riding #20 out of Cascade Village is the whole point. */
          if((D.noDest||[]).indexOf(to)>=0 && to!==S.finish && S.intent!=='challenge') continue;
          const ds=descentsFrom(tk,to,S.band); if(!ds.length) continue;
          /* Hayden's rule: people who want to SKI want more ups and downs, not one
             long traverse. Cat-track minutes are time spent not skiing. So rank by
             real-skiing minutes, and for strong skiers make road time cost triple. */
          const wRoad = S.band>=3 ? 3 : (S.band===2 ? 1.4 : 0.6);
          ds.forEach(x=>{ x.char=character(x.via,S.intent)+conditions(x.via,p,tTop);
            x.cost = (x.min - x.road) + x.road*wRoad - (x.band>=S.band?4:0) - x.char/22; });
          ds.sort((a,b)=>a.cost-b.cost);
          const pick=ds[0];
          const tEnd=tTop+pick.min;
          const back=home[to]; if(back==null) continue;
          if(tEnd+back>S.endT) continue;                 // couldn't get home
          const rep=st.seen[p]||0;
          let villagePenalty=0;
          /* On the challenge you MUST come back to the villages — that is where
             the base lifts load. Penalising village arrivals is what stranded
             #12 at Golden Peak and #8/#19 at Lionshead. */
          if(S.intent!=='challenge' && VILLAGE[to] && to!==S.finish){
            /* arriving at a village you did not leave from is village-hopping */
            villagePenalty = (VILLAGE[st.node] && st.node!==to) ? 5200 : 1500;
            /* and the higher the lift you just rode, the less sense it makes to
               dump all of it to reach a base */
            villagePenalty += P[p].rise*0.55;
          }
          const lastLift=st.plan.length?st.plan[st.plan.length-1].lift:null;
          let repW=repeatCost(p);
          if(S.intent==='explore') repW=2.6;                 /* novelty is the point */
          let gain=P[p].rise*(pick.band>=S.band?1:0.72)/(1+rep*repW)*(p===lastLift?(LAP1[p]?0.9:0.45):1);
          gain+=pick.char;
          if(S.intent==='explore'){
            if(!st.seen[p]) gain+=1400;                       /* a lift you have not ridden */
            const ar=AREA[p];
            if(ar && !st.areas[ar]) gain+=3800;               /* a corner of the mountain you have not seen */
          }
          if(S.intent==='quiet')   gain+=QUIET[p]?1500:(QUIETISH[p]?600:-500);
          if(S.intent==='family')  gain+=(pick.band<=2?800:-900);
          if(S.intent==='scenic'){
            /* A view is worth far less the fifth time you see it — you take the
               photo once. So the ride bonus decays and the photo op only pays out
               the first time you stand there. */
            gain += ((D.scenicLift||{})[p]||0)*1500/(1+rep*1.6);
            if((D.photoOp||{})[TOPKEY[p]] && !rep) gain+=2600;
            if((D.photoOp||{})[to] && !st.shot[to]) gain+=1100;
          }
          if(Object.keys(S.focus).length) gain += S.focus[AREA[p]] ? 2200 : -1400;
          if(S.intent==='challenge'){
            /* every lift once. A lift you have already ridden is worthless;
               an unridden one is the whole point, and the ones that shut first
               are worth chasing early. */
            if(rep) gain=-90000;
            else {
              /* Chase the lifts that are hardest to fit: the ones that shut
                 earliest, and the ones only reachable from a couple of places.
                 Cascade #20 is the classic — a dead-end village you have to go
                 out of your way for, so it never gets picked up incidentally. */
              const inb=(D.inbound||{})[p]||9;
              gain = 12000 + Math.max(0,(16*60-closeOf(p)))*22 + Math.max(0,(6-inb))*2600;
            }
          }
          const cost=q*38+(pick.min-pick.road)*3+pick.road*(S.band>=3?26:9)+villagePenalty;
          let tAfter=tEnd, ate=st.ate;
          if(S.lunchAt!=null && !ate && tEnd>=S.lunchAt){
            if(!(D.food||{})[to]) continue;                  /* nowhere to eat here */
            tAfter=Math.max(tEnd,S.lunchAt)+S.lunchMin; ate=to;
          }
          if(S.intent==='challenge'){
            /* anything you can no longer get to before it shuts is a lift lost */
            let lost=0;
            for(const q of challengeSet()){
              if(q===p||st.seen[q]) continue;
              const dd=(RT[q]||{})[to];
              if(dd==null || tAfter+dd > closeOf(q)) lost++;
            }
            var lostPenalty=lost*26000;
          } else var lostPenalty=0;
          const ns={node:to,t:tAfter,ate:ate,vert:st.vert+P[p].rise,runs:st.runs+1,
            seen:Object.assign({},st.seen,{[p]:rep+1}),
            shot:((D.photoOp||{})[to]?Object.assign({},st.shot,{[to]:1}):st.shot),
            areas:AREA[p]?Object.assign({},st.areas,{[AREA[p]]:1}):st.areas,
            score:st.score+gain-cost-lostPenalty,
            plan:st.plan.concat([{lift:p,board:t0,q:q,top:tTop,tk:tk,to:to,
              via:pick.via,way:pick.way,dmin:pick.min,band:pick.band,end:tEnd,
              lunch:(ate&&ate!==st.ate)?((D.food[to]||[]).map(f=>f[0]).join(' / ')):null,
              lunchEnd:(ate&&ate!==st.ate)?tAfter:null}])};
          next.push(ns);
        }
      }
    }
    if(!next.length) break;
    next.sort((a,b)=>b.score-a.score);
    beam.length=0; const key={};
    for(const s of next){ const k=s.node+'|'+s.plan.length; key[k]=(key[k]||0)+1;
      if(key[k]<=(S.intent==='challenge'?14:4)) beam.push(s); if(beam.length>=W) break; }
    for(const s of beam) if(s.node===S.finish && (S.lunchAt==null||s.ate)){
      if(best===null) best=s;
      else if(S.intent==='challenge'){ const x=Object.keys(s.seen).length,y=Object.keys(best.seen).length;
        if(x>y||(x===y&&s.t<best.t)) best=s; }
      else if(s.score>best.score) best=s; }
  }
  S.plan=best; S.note='';
  if(best){
    const blue=best.plan.filter(x=>D.blue.indexOf(x.lift)>=0);
    if(blue.length){ const l=blue[blue.length-1];
      S.note='Blue Sky shuts from the back forward \u2014 Pete\u2019s '+hhmm(closeOf('p39'))+
        ', Earl\u2019s '+hhmm(closeOf('p38'))+', Skyline '+hhmm(closeOf('p37'))+
        '. Your last lap back there boards at '+hhmm(l.board)+'.'; }
    else if(best.plan.some(x=>x.lift==='p36'))
      S.note='Tea Cup is the only way out of the back bowls and the line stacks up near close. Chair 21 is the other exit if it looks long.';
    /* the challenge verdict outranks the general advice */
    if(S.intent==='challenge'){
      const need=challengeSet(), got=new Set(best.plan.map(x=>x.lift));
      const missed=need.filter(p=>!got.has(p));
      const full=(D.challenge||[]).length;
      if(need.length < Math.ceil(full*0.75))
        S.note='Only '+need.length+' of '+full+' lifts are running, so this is not really the chairlift challenge \u2014 a good day out, not the badge.';
      else if(missed.length)
        S.note='Couldn\u2019t fit '+missed.length+' lift'+(missed.length>1?'s':'')+': '
          +missed.map(p=>'#'+P[p].num).join(', ')+'. Try an earlier start or a later finish.';
      else S.note='Every lift running today, ridden once. That is the badge.';
    }
  }
  render();
}

/* ---------------- UI ---------------- */
const STARTS=['p1.base','cluster:lionshead','cluster:golden_peak','cluster:mid_vail','p20.base','bottom of #6m'];
function nodeOpts(sel){ return STARTS.filter(n=>BOARD[n]||n===sel)
  .map(n=>'<option value="'+n+'"'+(n===sel?' selected':'')+'>'+nname(n)+'</option>').join(''); }
function tf(m){ const h=Math.floor(m/60), x=Math.round(m%60);
  return String(h).padStart(2,'0')+':'+String(x).padStart(2,'0'); }

     +'</div><p class="via" style="margin-top:9px">Groomed runs skip the freeze-thaw curve. Untick anything they left alone.</p></div>') : '')

   + [11*60,11.5*60,12*60,12.5*60,13*60].map(m=>'<button class="opt" data-lunch="'+m+'" aria-pressed="'+(S.lunchAt===m)+'">'+hhmm(m)+'</button>').join('')
   +'</div></div>'

   +'</div></div>'
   +'<div class="card"><span class="lab">Conditions</span><div class="opts">'
   +'<button class="opt" data-season="early" aria-pressed="'+(S.season==='early')+'">Early season</button>'
   +'<button class="opt" data-season="late" aria-pressed="'+(S.season==='late')+'">Mid to late</button>'
   +'<button class="opt" data-pow="1" aria-pressed="'+S.powder+'">Powder day</button>'

   +'</div></div>'
   +'<button class="go" id="go">Build the day</button>';

  if(S.plan){

      +(S.intent==='explore'?'<div class="stat"><b>'+(new Set(pl.map(x=>AREA[x.lift]).filter(Boolean)).size)+'/'+Object.keys(AREAS).length+'</b><i>areas seen</i></div>':'')
      +'</div>';
    h+='<div class="day">';
    h+='<div class="stop"><span class="dot"></span><span class="clock">'+hhmm(pl[0].board)+'</span>'

      h+='<div class="stop lift"><span class="dot"></span><span class="clock">'+hhmm(s.board)+'</span>'

        +(S.intent==='scenic'&&(D.photoOp||{})[TOPKEY[s.lift]]?'<p class="meta" style="color:var(--gold)">\u25c9 '+D.photoOp[TOPKEY[s.lift]]+'</p>':'')
        +'</div>';
      h+='<div class="stop"><span class="dot"></span><span class="clock">'+hhmm(s.top)+'</span>'

    const k=b.dataset.rare.toLowerCase(); if(S.rare[k]) delete S.rare[k]; else S.rare[k]=1; render();});
  a.querySelectorAll('[data-rare]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.rare.toLowerCase(); if(S.rare[k]) delete S.rare[k]; else S.rare[k]=1; render();});
  a.querySelectorAll('[data-closed]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.closed; if(S.closed[k]) delete S.closed[k]; else S.closed[k]=1; render();});
  a.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.area; if(S.focus[k]) delete S.focus[k]; else S.focus[k]=1; render();});
  a.querySelectorAll('[data-lunch]').forEach(b=>b.onclick=()=>{
    S.lunchAt=b.dataset.lunch?+b.dataset.lunch:null; render();});
  a.querySelectorAll('[data-season]').forEach(b=>b.onclick=()=>{S.season=b.dataset.season;render();});
  a.querySelectorAll('[data-pow]').forEach(b=>b.onclick=()=>{S.powder=!S.powder;render();});
  a.querySelectorAll('[data-spring]').forEach(b=>b.onclick=()=>{S.spring=!S.spring;
    if(S.spring&&S.season!=='late') S.season='late'; render();});
  document.getElementById('go').onclick=()=>{S.tried=1;build();};
}
render();
</script>
<script>
/* ============================================================
   LIFT ORDER CHECK  ·  added 2026-08-13
   Walks a lift order against D and flags the first pair with no
   connection. Also folds partial rides onto their parent chair,
   so 6m counts as chair 6 for every-lift and no-repeat rules.
   ============================================================ */
(function(){
  if(typeof D==='undefined') return;
  var byNum={}; Object.keys(D.pods).forEach(function(id){ byNum[String(D.pods[id].num)]=id; });
  function chair(id){ return (D.pods[id]&&D.pods[id].same) || id; }   /* 6m -> 6 */
  function label(id){ var p=D.pods[id]; return p? p.name+' #'+p.num : id; }

  /* every node you can stand at after riding pod id */
  function topOf(id){ return D.topOf[id]; }
  /* every node from which you can board pod id */
  function boardNodes(id){
    var out=[]; Object.keys(D.board).forEach(function(n){
      if(D.board[n].indexOf(id)>-1) out.push(n); });
    return out;
  }
  /* can you get from node `from` to any node that boards `to`? */
  function link(from,to){
    var targets=boardNodes(to);
    for(var i=0;i<targets.length;i++){
      if(targets[i]===from) return {ok:true,how:'same place'};
      var tbl=D.table[from];
      if(tbl&&tbl[targets[i]]){
        var bands=tbl[targets[i]], best=null;
        Object.keys(bands).forEach(function(b){
          bands[b].forEach(function(r){ if(!best||r[0]<best[0]) best=r; });
        });
        if(best) return {ok:true,how:best[1].join(' \u2192 '),min:best[0]};
      }
    }
    return {ok:false};
  }

  window.checkLiftOrder=function(order){
    var ids=order.map(function(n){ return byNum[String(n).replace('#','')]; });
    var rows=[], seen={}, dupes=[];
    ids.forEach(function(id,i){
      if(!id){ rows.push({i:i,bad:'unknown lift: '+order[i]}); return; }
      var c=chair(id);
      if(seen[c]) dupes.push(label(id)+' repeats chair '+D.pods[c].num);
      seen[c]=true;
      if(i===0){ rows.push({i:i,id:id,note:'start'}); return; }
      var prev=ids[i-1];
      if(!prev) return;
      var l=link(topOf(prev),id);
      rows.push({i:i,id:id,ok:l.ok,how:l.how,min:l.min,
        bad:l.ok?null:'no way from the top of '+label(prev)+' to '+label(id)});
    });
    var broken=rows.filter(function(r){return r.bad;});
    return {rows:rows,broken:broken,repeats:dupes,
            uniqueChairs:Object.keys(seen).length,ok:broken.length===0};
  };

  /* a small panel so the tool says what is possible instead of you guessing */
  try{
    var box=document.createElement('div');
    box.style.cssText='position:fixed;right:14px;bottom:14px;z-index:99999;width:330px;'+
      'font:12px/1.45 ui-monospace,Menlo,monospace;background:#15181F;color:#DDE3EE;'+
      'border:1px solid #333B4C;border-radius:12px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.5)';
    box.innerHTML='<div style="font-weight:700;letter-spacing:.08em;margin-bottom:8px">'+
      'LIFT ORDER CHECK</div>'+
      '<input id="_loInput" value="12,6,16,10,11,14" style="width:100%;box-sizing:border-box;'+
      'background:#0C0E13;color:#DDE3EE;border:1px solid #333B4C;border-radius:7px;padding:7px">'+
      '<button id="_loGo" style="margin-top:8px;width:100%;background:#CE8B71;color:#1A1826;'+
      'border:0;border-radius:7px;padding:8px;font-weight:800;letter-spacing:.1em">CHECK</button>'+
      '<div id="_loOut" style="margin-top:9px;max-height:260px;overflow:auto"></div>';
    document.body.appendChild(box);
    document.getElementById('_loGo').onclick=function(){
      var order=document.getElementById('_loInput').value.split(/[^0-9a-zA-Z]+/).filter(Boolean);
      var r=window.checkLiftOrder(order);
      var h=r.rows.map(function(x){
        if(x.bad) return '<div style="color:#E08B7A">'+(x.i+1)+' \u2716 '+x.bad+'</div>';
        if(x.note) return '<div style="color:#8E99AD">'+(x.i+1)+' '+label(x.id)+' \u00b7 start</div>';
        return '<div style="color:#9AB58F">'+(x.i+1)+' \u2713 '+label(x.id)+
          '<div style="color:#8E99AD;padding-left:14px">'+x.how+
          (x.min?' \u00b7 '+x.min+' min':'')+'</div></div>';
      }).join('');
      if(r.repeats.length) h+='<div style="color:#E6D3A8;margin-top:6px">'+
        r.repeats.join('<br>')+'</div>';
      h+='<div style="margin-top:8px;color:#8E99AD">'+r.uniqueChairs+' unique chairs \u00b7 '+
        (r.ok?'order is legal':r.broken.length+' broken link(s)')+'</div>';
      document.getElementById('_loOut').innerHTML=h;
    };
  }catch(e){}
})();
</script>
</body></html>
