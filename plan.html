<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SKOPE · Plan a day at Vail</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --slate:#3A4152; --slate2:#454D60; --ink:#2E3442;
  --accent:#E9A57F; --gold:#EBC77E; --glacier:#8FB4D8;
  --txt:#EEF1F6; --mut:#A9B3C6; --mut2:#7E8AA0;
  --green:#4CA96C; --blue:#5B93D6; --black:#E8EBF2; --dbl:#E96F6F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:linear-gradient(168deg,var(--slate) 0%,var(--slate2) 62%,#4B5468 100%);
  background-attachment:fixed;color:var(--txt);
  font-family:Poppins,system-ui,sans-serif;font-size:15px;line-height:1.5;
  padding:0 0 64px;-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:0 18px}

/* ---- masthead: the cable ---- */
header{padding:30px 0 20px;position:relative}
.brand{display:flex;align-items:baseline;gap:11px}
.brand h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.02em}
.brand span{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
.sub{margin:7px 0 0;color:var(--mut);font-size:13.5px;font-weight:500}
.cable{height:22px;margin:16px 0 0;position:relative;overflow:hidden}
.cable svg{display:block;width:100%;height:22px}

/* ---- controls ---- */
.card{background:rgba(46,52,66,.5);border:1px solid rgba(169,179,198,.16);
  border-radius:16px;padding:15px 15px 17px;margin:0 0 13px}
.lab{display:block;font-size:10.5px;font-weight:800;letter-spacing:.13em;
  text-transform:uppercase;color:var(--mut2);margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{border:1px solid rgba(169,179,198,.3);background:transparent;color:var(--mut);
  border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
  transition:.14s}
.opt:hover{border-color:rgba(233,165,127,.5)}
.opt[aria-pressed="true"]{background:rgba(233,165,127,.16);border-color:var(--accent);color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--glacier);outline-offset:2px}
.row{display:flex;gap:11px}.row>div{flex:1}
select,input[type=time]{width:100%;background:rgba(46,52,66,.75);color:var(--txt);
  border:1px solid rgba(169,179,198,.28);border-radius:10px;padding:10px 11px;
  font:inherit;font-size:14px;font-weight:600}
select:focus-visible,input:focus-visible{outline:2px solid var(--glacier);outline-offset:1px}
.go{width:100%;margin-top:4px;background:var(--accent);color:#2B3040;border:none;
  border-radius:13px;padding:15px;font:inherit;font-size:15.5px;font-weight:800;
  letter-spacing:.01em;cursor:pointer;transition:.14s}
.go:hover{filter:brightness(1.06)}.go:active{transform:scale(.985)}
.go:disabled{opacity:.5;cursor:default}

/* ---- the day ---- */
.summary{display:flex;gap:0;margin:22px 0 4px;border-radius:14px;overflow:hidden;
  border:1px solid rgba(169,179,198,.18)}
.stat{flex:1;padding:13px 8px;text-align:center;background:rgba(46,52,66,.45)}
.stat+.stat{border-left:1px solid rgba(169,179,198,.14)}
.stat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--gold)}
.stat i{display:block;font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--mut2);margin-top:3px}

.day{position:relative;margin:20px 0 0;padding-left:46px}
.day::before{content:"";position:absolute;left:19px;top:12px;bottom:12px;width:2px;
  background:linear-gradient(180deg,transparent,rgba(143,180,216,.55) 8%,rgba(143,180,216,.55) 92%,transparent)}
.stop{position:relative;margin:0 0 4px;padding:0 0 16px}
.dot{position:absolute;left:-34px;top:4px;width:15px;height:15px;border-radius:50%;
  background:var(--slate);border:2px solid var(--glacier)}
.stop.lift .dot{border-color:var(--accent);background:var(--accent)}
.stop.lift .dot::after{content:"";position:absolute;left:50%;top:-11px;width:2px;height:11px;
  background:var(--accent);transform:translateX(-50%)}
.clock{font-size:11.5px;font-weight:800;letter-spacing:.05em;color:var(--glacier)}
.stop.lift .clock{color:var(--accent)}
.what{margin:2px 0 0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.via{margin:5px 0 0;font-size:13px;color:var(--mut);line-height:1.55;font-weight:500}
.meta{margin:6px 0 0;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--mut2)}
.pill{display:inline-block;margin:0 5px 0 0;padding:2px 7px;border-radius:6px;font-size:10px;
  font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.d1{background:rgba(76,169,108,.18);color:#79C994}
.d2{background:rgba(91,147,214,.2);color:#8FB4D8}
.d3{background:rgba(232,235,242,.14);color:#D6DCE8}
.d4{background:rgba(233,111,111,.18);color:#E96F6F}
.warn{background:rgba(235,199,126,.13);border:1px solid rgba(235,199,126,.4);
  color:var(--gold);border-radius:12px;padding:12px 13px;font-size:12.5px;font-weight:600;
  line-height:1.5;margin:14px 0 0}
.empty{text-align:center;color:var(--mut);padding:34px 16px;font-size:13.5px;line-height:1.6}
.foot{margin:26px 0 0;padding-top:16px;border-top:1px solid rgba(169,179,198,.14);
  color:var(--mut2);font-size:11px;line-height:1.6;font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

/* ============ SKOPE day planner ============ */
const P=D.pods, TBL=D.table, BOARD=D.board, LBL=D.lbl;
const BAND=['','Green','Blue','Black','Double black'];
const hhmm=m=>{let t=Math.round(m);const h=Math.floor(t/60),x=t%60;const ap=h>=12?'pm':'am';
  const hh=h%12===0?12:h%12;return hh+':'+String(x).padStart(2,'0')+ap;};
const nname=n=>LBL[n]||n;
const podAt=n=>(BOARD[n]||[]).filter(p=>P[p]);
// where riding each lift drops you (canonical top node)
const SUMMIT={p1:'cluster:mid_vail',p19:'p15.top',p26:'p15.top',p24:'p14.top',
  p6:'p6.top',p12:'p12.top',p37:'p37.top',p38:'p38.top',p39:'p39.top'};
const TOPKEY={};
Object.keys(P).forEach(p=>{ TOPKEY[p]= TBL[p+'.top'] ? p+'.top' : (TBL[SUMMIT[p]]?SUMMIT[p]:null); });

let S={start:'p1.base',startT:9*60,endT:15*60,finish:'p1.base',
  season:'late',band:3,powder:false,plan:null,note:''};

function closeOf(p){ return P[p].close + (S.season==='late'?30:0); }
function openMtn(){ return (S.season==='late'?8.5:9)*60; }
function openBlue(){ return (S.season==='late'?9.5:10)*60; }
function daypart(t){ if(t<9.5*60)return 0; if(t<11.5*60)return 1; if(t<13*60)return 2;
  if(t<14.5*60)return 3; return 4; }
function queue(p,t){ let q=P[p].q[daypart(t)]; if(S.powder&&P[p].pow) q=Math.round(q*1.8+3); return q; }
function liftReady(p,t){ const o=(D.blue.indexOf(p)>=0)?openBlue():openMtn(); return Math.max(t,o); }

/* how few minutes from node n to the finish, ignoring queues — for the "can I get home" test */
const HOME={};
function homeTimes(fin){
  const dist={}; dist[fin]=0; let ch=true, it=0;
  while(ch&&it++<40){ ch=false;
    for(const src in TBL){ // src is a lift top
      for(const to in TBL[src]){ // landings
        let best=1e9; for(const b in TBL[src][to]){ for(const d of TBL[src][to][b]) best=Math.min(best,d[0]); }
        if(dist[to]!=null && dist[to]+best<(dist[src]??1e9)){ dist[src]=dist[to]+best; ch=true; }
      } }
    for(const n in BOARD){ for(const p of podAt(n)){ const tk=TOPKEY[p]; if(!tk) continue;
      const v=(dist[tk]??1e9)+P[p].ride+2;
      if(v<(dist[n]??1e9)){ dist[n]=v; ch=true; } } }
  }
  return dist;
}

function chainText(legs){
  const runs=[];
  legs.forEach(l=>l.split('\u2192').map(x=>x.trim()).filter(Boolean).forEach(r=>{
    if(runs.length && runs[runs.length-1]===r) return;   // same run continuing across a leg
    runs.push(r); }));
  return runs.join(' \u2192 ');
}
function descentsFrom(tk,to,maxBand){
  const bands=TBL[tk]&&TBL[tk][to]; if(!bands) return [];
  let out=[];
  for(const b in bands){ if(+b>maxBand) continue;
    for(const d of bands[b]) out.push({min:d[0],via:chainText(d[1]),band:+b,road:d[2]||0,legs:d[1].length,way:(d[3]||[]).map(x=>LBL[x]||x)}); }
  return out;
}

/* Hayden's rule: BASE LIFTS ARE FOR MOVING UP THE MOUNTAIN. Skiing base to base
   to base is not how anyone rides. Lapping your OWN base is fine when the lap is
   right (ride the Riva Bahn mid, ski Ruder's Run, ride back up; or Eagle's Nest
   and the top of #8 back down to Lionshead). What is unnatural is giving up the
   whole mountain's vertical to arrive at a village you did not start from. */
const VILLAGE={'p1.base':1,'cluster:lionshead':1,'cluster:golden_peak':1,'p20.base':1};
/* Hayden's lappability tiers. Tier 1 has fire terrain off it or is simply worth
   revisiting, so riding it again is normal, not a failure of imagination. Tier 2
   earns a second visit depending on the runs or the day. Everything else is a
   connector — riding it twice usually means the plan is going in circles. */
const LAP1={p3:1,p4:1,p5:1,p7:1,p9:1,p11:1,p17:1,p21:1,p36:1,p39:1};
const LAP2={p2:1,p6m:1,p8:1,p10:1,p14:1,p16:1,p26:1,p37:1,p38:1};
const repeatCost=p=>LAP1[p]?0.22:(LAP2[p]?0.6:1.25);
function build(){
  const home=homeTimes(S.finish);
  const beam=[{node:S.start,t:Math.max(S.startT,openMtn()),plan:[],vert:0,runs:0,seen:{},score:0}];
  let best=null, W=90;
  for(let step=0;step<26;step++){
    const next=[];
    for(const st of beam){
      const h=home[st.node]; 
      if(st.node===S.finish && st.plan.length && (best===null||st.score>best.score)) best=st;
      for(const p of podAt(st.node)){
        const tk=TOPKEY[p]; if(!tk) continue;
        let t0=liftReady(p,st.t); const q=queue(p,t0);
        if(t0+q>closeOf(p)) continue;                    // line closes before you'd board
        const tTop=t0+q+P[p].ride;
        for(const to in TBL[tk]){
          /* Cascade is where you start or end the day, not a place you ski to
             mid-day. Only allow it as a landing if it IS your finish. */
          if((D.noDest||[]).indexOf(to)>=0 && to!==S.finish) continue;
          const ds=descentsFrom(tk,to,S.band); if(!ds.length) continue;

          const wRoad = S.band>=3 ? 3 : (S.band===2 ? 1.4 : 0.6);
          ds.forEach(x=>{ x.cost = (x.min - x.road) + x.road*wRoad - (x.band>=S.band?4:0); });

          const back=home[to]; if(back==null) continue;
          if(tEnd+back>S.endT) continue;                 // couldn't get home
          const rep=st.seen[p]||0;
          let villagePenalty=0;
          if(VILLAGE[to] && to!==S.finish){
            /* arriving at a village you did not leave from is village-hopping */
            villagePenalty = (VILLAGE[st.node] && st.node!==to) ? 5200 : 1500;
            /* and the higher the lift you just rode, the less sense it makes to
               dump all of it to reach a base */
            villagePenalty += P[p].rise*0.55;
          }
          const lastLift=st.plan.length?st.plan[st.plan.length-1].lift:null;
          const gain=P[p].rise*(pick.band>=S.band?1:0.72)/(1+rep*repeatCost(p))*(p===lastLift?(LAP1[p]?0.9:0.45):1);
          const cost=q*38+(pick.min-pick.road)*3+pick.road*(S.band>=3?26:9)+villagePenalty;
          const ns={node:to,t:tEnd,vert:st.vert+P[p].rise,runs:st.runs+1,
            seen:Object.assign({},st.seen,{[p]:rep+1}),
            score:st.score+gain-cost,
            plan:st.plan.concat([{lift:p,board:t0,q:q,top:tTop,tk:tk,to:to,
              via:pick.via,way:pick.way,dmin:pick.min,band:pick.band,end:tEnd}])};
          next.push(ns);
        }
      }
    }
    if(!next.length) break;
    next.sort((a,b)=>b.score-a.score);
    beam.length=0; const key={};
    for(const s of next){ const k=s.node+'|'+s.plan.length; key[k]=(key[k]||0)+1;
      if(key[k]<=4) beam.push(s); if(beam.length>=W) break; }
    for(const s of beam) if(s.node===S.finish && (best===null||s.score>best.score)) best=s;
  }
  S.plan=best; S.note='';
  if(best){
    const last=best.plan[best.plan.length-1];
    const blue=best.plan.filter(x=>D.blue.indexOf(x.lift)>=0);
    if(blue.length){ const l=blue[blue.length-1];
      S.note='Blue Sky shuts from the back forward — Pete\u2019s '+hhmm(closeOf('p39'))+
        ', Earl\u2019s '+hhmm(closeOf('p38'))+', Skyline '+hhmm(closeOf('p37'))+
        '. Your last lap back there boards at '+hhmm(l.board)+'.'; }
    else if(best.plan.some(x=>x.lift==='p36'))
      S.note='Teacup is the only way out of the back bowls and the line stacks up near close. Chair 21 is the other exit if it looks long.';
  }
  render();
}

/* ---------------- UI ---------------- */
const STARTS=['p1.base','cluster:lionshead','cluster:golden_peak','cluster:mid_vail','p20.base','bottom of #6m'];
function nodeOpts(sel){ return STARTS.filter(n=>BOARD[n]||n===sel)
  .map(n=>'<option value="'+n+'"'+(n===sel?' selected':'')+'>'+nname(n)+'</option>').join(''); }
function tf(m){ const h=Math.floor(m/60), x=Math.round(m%60);
  return String(h).padStart(2,'0')+':'+String(x).padStart(2,'0'); }

function render(){
  const a=document.getElementById('app');
  let h='<div class="card">'
   +'<span class="lab">Where you start</span>'
   +'<div class="row"><div><select id="start">'+nodeOpts(S.start)+'</select></div>'
   +'<div><input type="time" id="st" value="'+tf(S.startT)+'"></div></div></div>'
   +'<div class="card"><span class="lab">Where you finish</span>'
   +'<div class="row"><div><select id="fin">'+nodeOpts(S.finish)+'</select></div>'
   +'<div><input type="time" id="et" value="'+tf(S.endT)+'"></div></div></div>'
   +'<div class="card"><span class="lab">How hard you ski</span><div class="opts">'
   + [1,2,3,4].map(b=>'<button class="opt" data-band="'+b+'" aria-pressed="'+(S.band===b)+'">'+BAND[b]+'</button>').join('')
   +'</div></div>'
   +'<div class="card"><span class="lab">Conditions</span><div class="opts">'
   +'<button class="opt" data-season="early" aria-pressed="'+(S.season==='early')+'">Early season</button>'
   +'<button class="opt" data-season="late" aria-pressed="'+(S.season==='late')+'">Mid to late</button>'
   +'<button class="opt" data-pow="1" aria-pressed="'+S.powder+'">Powder day</button>'
   +'</div></div>'
   +'<button class="go" id="go">Build the day</button>';

  if(S.plan){
    const pl=S.plan.plan, mins=pl[pl.length-1].end-pl[0].board;
    const inLine=pl.reduce((x,y)=>x+y.q,0);
    h+='<div class="summary">'
      +'<div class="stat"><b>'+pl.length+'</b><i>laps</i></div>'
      +'<div class="stat"><b>'+S.plan.vert.toLocaleString()+'</b><i>vertical ft</i></div>'
      +'<div class="stat"><b>'+Math.round(mins)+'</b><i>minutes out</i></div>'
      +'<div class="stat"><b>'+inLine+'</b><i>min in line</i></div></div>';
    h+='<div class="day">';
    h+='<div class="stop"><span class="dot"></span><span class="clock">'+hhmm(pl[0].board)+'</span>'
      +'<p class="what">Start at '+nname(S.start)+'</p></div>';
    pl.forEach(s=>{
      const p=P[s.lift];
      h+='<div class="stop lift"><span class="dot"></span><span class="clock">'+hhmm(s.board)+'</span>'
        +'<p class="what">Ride #'+p.num+' '+p.name+'</p>'
        +'<p class="meta">'+(s.q?s.q+' min in line · ':'walk on · ')+Math.round(p.ride)+' min up · '+p.rise.toLocaleString()+' ft</p></div>';
      h+='<div class="stop"><span class="dot"></span><span class="clock">'+hhmm(s.top)+'</span>'
        +'<p class="what"><span class="pill d'+s.band+'">'+BAND[s.band]+'</span>Ski to '+nname(s.to)+'</p>'
        +'<p class="via">'+s.via+'</p>'
        +(s.way&&s.way.length?'<p class="meta" style="color:var(--glacier)">through '+s.way.join(' \u00b7 ')+'</p>':'')
        +'<p class="meta">'+Math.round(s.dmin)+' min down · down at '+hhmm(s.end)+'</p></div>';
    });
    h+='</div>';
    if(S.note) h+='<div class="warn">'+S.note+'</div>';
  } else if(S.plan===null && S.tried){
    h+='<div class="empty">No day fits between those times from there.<br>Try a later finish, an easier grade, or start somewhere with a lift.</div>';
  }
  a.innerHTML=h;

  document.getElementById('start').onchange=e=>{S.start=e.target.value;};
  document.getElementById('fin').onchange=e=>{S.finish=e.target.value;};
  document.getElementById('st').onchange=e=>{const[x,y]=e.target.value.split(':');S.startT=+x*60+ +y;};
  document.getElementById('et').onchange=e=>{const[x,y]=e.target.value.split(':');S.endT=+x*60+ +y;};
  a.querySelectorAll('[data-band]').forEach(b=>b.onclick=()=>{S.band=+b.dataset.band;render();});
  a.querySelectorAll('[data-season]').forEach(b=>b.onclick=()=>{S.season=b.dataset.season;render();});
  a.querySelectorAll('[data-pow]').forEach(b=>b.onclick=()=>{S.powder=!S.powder;render();});
  document.getElementById('go').onclick=()=>{S.tried=1;build();};
}
render();
</script></body></html>
