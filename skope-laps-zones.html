.bar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;align-items:center}

.line{flex:1;font-size:13.5px;word-break:break-word}
.chain{color:var(--warn);font-size:11px;letter-spacing:.06em}

.mv{display:flex;flex-direction:column;gap:2px}

.mv button:hover{color:var(--peach)}
.more{padding:8px 14px 13px}

.cand button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:7px;font-size:11px;padding:3px 8px;cursor:pointer;white-space:nowrap}
.zrow{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.05)}
.zrow:last-child{border-bottom:0}
.g{width:13px;height:13px;flex:0 0 13px;border-radius:3px}
.g.e{background:var(--green);border-radius:50%}
.g.m{background:var(--blue)}
.g.b{background:var(--black);transform:rotate(45deg);border:1px solid #444}
.g.x{background:var(--black);border:1px solid #666;border-radius:0}
.rname{flex:1;font-size:14px}
.flag{color:var(--warn);font-size:10px;letter-spacing:.08em;font-weight:700}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);

select.none{border-color:var(--peach-d);color:var(--peach)}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  border-radius:999px;padding:5px 11px;font-size:11.5px;cursor:pointer;letter-spacing:.05em}
.chip.on{background:var(--peach);color:#231A14;border-color:var(--peach-d);font-weight:700}
.out{position:fixed;inset:0;background:rgba(10,12,17,.93);display:none;padding:18px;z-index:20}
.out.on{display:flex;flex-direction:column}
.out textarea{flex:1;width:100%;background:var(--panel);color:var(--text);
  border:1px solid var(--line);border-radius:11px;padding:11px;font:12px/1.4 ui-monospace,Menlo,monospace}
.out .row{display:flex;gap:8px;padding-top:11px}
.hint{color:var(--dim);font-size:12px;padding:0 16px 12px;line-height:1.5}

const KEY = 'skope-laps-zones';
const ZONES = ['Vail Village','Mid-Vail','Golden Peak','Lionshead','Cascade Village',
  'Game Creek Bowl','Northeast Bowl','Sun Up Bowl','Sun Down Bowl',
  'China Bowl','Siberia Bowl','Tea Cup Bowl','Blue Sky Basin',
  "Pete's Bowl","Earl's Bowl",'Skyline'];
const GLY = {easiest:'e',road_green:'e',more:'m',road_blue:'m',most:'b',road_black:'b',extreme:'x',park:'m'};

let S = load();
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return fresh();
}
function fresh(){
  const laps = {}; Object.keys(SEED.laps).forEach(p => laps[p] = SEED.laps[p].pick.slice());
  const zones = {}; Object.keys(SEED.runs).forEach(r => zones[r] = SEED.runs[r].zone);
  return { laps, zones };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

let tab = 'laps', filter = 'all';

document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  tab = b.dataset.tab; filter = 'all';
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  draw();
});

function draw(){ tab === 'laps' ? drawLaps() : drawZones(); }

/* ── LAPS ─────────────────────────────────────────────────────────────── */
function drawLaps(){
  document.getElementById('filters').innerHTML = '';
  document.getElementById('hint').textContent =
    'Five runs you would actually lap this chair on, best first. Seeded with the fastest way straight back to its own base, direct lines first. Every way down is in the list underneath, nothing is hidden. Through a junction means the base is a shared village, not that you ride anything.';
  const order = Object.keys(SEED.laps).sort((a,b) =>
    (parseInt(SEED.laps[a].num) || 99) - (parseInt(SEED.laps[b].num) || 99));
  let h = '';
  order.forEach(p => {
    const L = SEED.laps[p], picks = S.laps[p] || [];
    h += '<div class="card"><div class="chead"><span class="num">#' + L.num + '</span>' +
      '<span class="cname">' + esc(L.name) + '</span>' +
      '<span class="czone">' + esc(L.zone || '') + '</span></div><ol class="picks">';
    if(!picks.length) h += '<li><span class="line" style="color:var(--dim)">Nothing picked yet. Add from the list below.</span></li>';
    picks.forEach((v, i) => {
      const meta = L.all.find(a => a.v === v);
      h += '<li><span class="rank">' + (i+1) + '</span><span class="line">' + esc(v) +
        (meta && !meta.d ? ' <span class="chain">through a junction</span>' : '') +
        (meta && meta.z ? ' <span class="chain">leaves the zone</span>' : '') + '</span>' +
        '<span class="mins">' + (meta ? meta.m + 'm' : '') + '</span>' +
        '<span class="mv"><button data-up="' + p + '|' + i + '">▲</button>' +
        '<button data-dn="' + p + '|' + i + '">▼</button>' +
        '<button data-rm="' + p + '|' + i + '">✕</button></span></li>';
    });
    h += '</ol><details class="more"><summary>Other ways down (' +
      L.all.filter(a => picks.indexOf(a.v) < 0).length + ')</summary>';
    L.all.filter(a => picks.indexOf(a.v) < 0).forEach(a => {
      h += '<div class="cand"><button data-add="' + p + '|' + esc(a.v) + '">Add</button>' +
        '<span class="line">' + esc(a.v) + (!a.d ? ' <span class="chain">through a junction</span>' : '') +
        (a.z ? ' <span class="chain">leaves the zone</span>' : '') +
        '</span><span class="mins">' + a.m + 'm</span></div>';
    });
    h += '</details></div>';
  });
  document.getElementById('main').innerHTML = h;
  const done = order.filter(p => (S.laps[p] || []).length >= 1).length;
  document.getElementById('count').textContent = done + ' of ' + order.length + ' lifts have picks';
  wireLaps();
}
function wireLaps(){
  document.querySelectorAll('[data-up]').forEach(b => b.onclick = () => {
    const [p, i] = b.dataset.up.split('|'); const a = S.laps[p]; const n = +i;
    if(n > 0){ [a[n-1], a[n]] = [a[n], a[n-1]]; save(); drawLaps(); }
  });
  document.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => {
    const [p, i] = b.dataset.dn.split('|'); const a = S.laps[p]; const n = +i;
    if(n < a.length - 1){ [a[n+1], a[n]] = [a[n], a[n+1]]; save(); drawLaps(); }
  });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    const [p, i] = b.dataset.rm.split('|'); S.laps[p].splice(+i, 1); save(); drawLaps();
  });
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
    const s = b.dataset.add; const p = s.slice(0, s.indexOf('|')); const v = unesc(s.slice(s.indexOf('|') + 1));
    S.laps[p] = S.laps[p] || []; S.laps[p].push(v); save(); drawLaps();
  });
}

/* ── ZONES ────────────────────────────────────────────────────────────── */
function drawZones(){
  const runs = Object.keys(SEED.runs).sort();
  const flagged = runs.filter(r => SEED.runs[r].flag);
  const blank = runs.filter(r => !S.zones[r]);
  document.getElementById('filters').innerHTML =
    chip('all', 'All ' + runs.length) + chip('flag', 'Origin disagrees ' + flagged.length) +
    chip('blank', 'Unset ' + blank.length);
  document.getElementById('hint').textContent =
    'One zone per run: where it ultimately puts you. Origin disagrees means the run starts in one zone and ends in another, so those are the ones worth a look.';
  let list = runs;
  if(filter === 'flag') list = flagged;
  if(filter === 'blank') list = blank;
  let h = '<div class="card">';
  list.forEach(r => {
    const M = SEED.runs[r], cur = S.zones[r];
    h += '<div class="zrow"><span class="g ' + (GLY[M.diff] || 'm') + '"></span>' +
      '<span class="rname">' + esc(r) +
      (M.flag ? ' <span class="flag">FROM ' + esc(String(M.origin || '').toUpperCase()) + '</span>' : '') +
      '</span><select class="' + (cur ? '' : 'none') + '" data-z="' + esc(r) + '">' +
      '<option value=""' + (cur ? '' : ' selected') + '>— pick —</option>' +
      ZONES.map(z => '<option' + (z === cur ? ' selected' : '') + '>' + z + '</option>').join('') +
      '</select></div>';
  });
  document.getElementById('main').innerHTML = h + '</div>';
  document.getElementById('count').textContent = (runs.length - blank.length) + ' of ' + runs.length + ' runs placed';
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => { filter = c.dataset.f; drawZones(); });
  document.querySelectorAll('[data-z]').forEach(s => s.onchange = () => {
    S.zones[unesc(s.dataset.z)] = s.value || null; save(); drawZones();
  });
}
function chip(f, label){
  return '<button class="chip' + (filter === f ? ' on' : '') + '" data-f="' + f + '">' + label + '</button>';
}

/* ── plumbing ─────────────────────────────────────────────────────────── */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function unesc(s){ return String(s).replace(/&quot;/g,'"').replace(/&lt;/g,'<').replace(/&amp;/g,'&'); }

document.getElementById('reset').onclick = () => {
  if(confirm('Throw away your changes and go back to the seeded picks?')){ S = fresh(); save(); draw(); }
};
document.getElementById('copy').onclick = () => {
  const laps = {}; Object.keys(S.laps).forEach(p => laps[p] = {
    lift: SEED.laps[p].name + ' #' + SEED.laps[p].num, laps: S.laps[p] });
  document.getElementById('outtext').value = JSON.stringify(
    { v: 1, built: new Date().toISOString(), laps, zones: S.zones }, null, 1);
  document.getElementById('out').classList.add('on');
};
document.getElementById('docopy').onclick = async () => {
  const t = document.getElementById('outtext');
  t.select();
  try{ await navigator.clipboard.writeText(t.value); document.getElementById('docopy').textContent = 'Copied'; }
  catch(e){ document.execCommand('copy'); document.getElementById('docopy').textContent = 'Copied'; }
  setTimeout(() => document.getElementById('docopy').textContent = 'Copy', 1400);
};
document.getElementById('close').onclick = () => document.getElementById('out').classList.remove('on');

draw();
</script></body></html>
