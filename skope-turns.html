<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKOPE · Turn labels</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#2E3442;--card:#3A4152;--card2:#434B5E;--line:#4A5266;--ink:#EDEFF5;--mut:#98A0B4;
 --acc:#E9A57F;--gold:#EBC77E;--glac:#8FB4D8;--ok:#7FBF9A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
 font:14px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:#262B37;border-bottom:1px solid var(--line);padding:12px 16px 10px}
.wm{font-family:Montserrat,sans-serif;font-weight:800;letter-spacing:.26em;text-indent:.26em;font-size:13px}
.sub{color:var(--mut);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:5px}
.bar{display:flex;gap:8px;align-items:center;margin-top:11px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:999px;
 padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
.pill.on{background:var(--acc);border-color:var(--acc);color:#2A2018;font-weight:700}
input.s{flex:1;min-width:140px;background:#222732;border:1px solid var(--line);border-radius:8px;
 color:var(--ink);padding:7px 11px;font:inherit;font-size:13px}
.prog{height:4px;background:#222732;border-radius:2px;margin-top:11px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
main{padding:14px 16px 120px;max-width:900px;margin:0 auto}
.grp{background:var(--card);border-radius:14px;padding:13px 14px 6px;margin-bottom:11px}
.gh{display:flex;align-items:baseline;gap:9px;padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:4px}
.gh b{font-family:Montserrat,sans-serif;font-weight:700;font-size:15px;letter-spacing:.01em}
.gh .at{color:var(--mut);font-size:11.5px}
.gh .ct{margin-left:auto;color:var(--mut);font-size:11px;white-space:nowrap}
.tag{font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:2px 6px;border-radius:4px;
 background:#2A3040;color:var(--glac)}
.tag.lift{color:var(--gold)}
.frame{color:var(--mut);font-size:10.5px;letter-spacing:.02em;padding:2px 0 6px;opacity:.85}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.row:last-child{border-bottom:0}
.row .to{flex:1;min-width:0;display:flex;align-items:center;gap:7px}
.row .to span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .u{color:var(--mut);font-size:11px;white-space:nowrap}
.d{width:9px;height:9px;flex:none;border-radius:50%}
.d.e{background:#6FB07A}.d.m{background:#5B8FC7}.d.b{background:#20242E;border:1.5px solid #9AA3B8}
.d.x{background:#20242E;border:1.5px solid #9AA3B8;border-radius:2px;transform:rotate(45deg);width:8px;height:8px}
.d.q{background:transparent;border:1.5px dashed #6E7488}
.d.rg{background:#6FB07A;opacity:.5}.d.rb{background:#5B8FC7;opacity:.5}.d.rk{background:#20242E;opacity:.6}
.d.p{background:#B58FD8}
.seg{display:flex;gap:3px;flex:none}
.seg button{width:30px;height:28px;border-radius:7px;border:1px solid var(--line);background:#333A49;
 color:var(--mut);font-size:14px;line-height:1;cursor:pointer;padding:0}
.seg button svg{width:18px;height:18px;display:block;margin:0 auto}
.key .g{display:inline-block;vertical-align:-3px}
.key .g svg{width:14px;height:14px}
.seg button:hover{color:var(--ink);border-color:#5D6478}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#2A2018;font-weight:700}
.seg button.auto{background:#333A49;border-color:var(--line);color:var(--ok)}
.done .to span{color:var(--mut)}
.row.bad .to span{text-decoration:line-through;color:#6E7488}
.row.bad .seg{opacity:.25;pointer-events:none}
.x{width:28px;height:28px;flex:none;margin-left:6px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:12px;line-height:1;cursor:pointer;padding:0}
.x:hover{color:#E58A7A;border-color:#E58A7A}
.x.on{background:#8E4A44;border-color:#8E4A44;color:#FFE9E4}
footer{position:fixed;left:0;right:0;bottom:0;background:#262B37;border-top:1px solid var(--line);
 padding:10px 16px;display:flex;gap:9px;align-items:center;z-index:5}
footer .n{color:var(--mut);font-size:12px}
footer button{margin-left:auto;background:var(--acc);border:0;color:#2A2018;font-weight:700;
 border-radius:9px;padding:9px 15px;font:inherit;font-size:13px;cursor:pointer}
footer button.ghost{background:transparent;border:1px solid var(--line);color:var(--mut);margin-left:0;font-weight:400}
.key{color:var(--mut);font-size:11px;padding:10px 2px 0}
.rule{margin-top:7px;padding:7px 9px;border-left:2px solid var(--acc);background:#2A303D;border-radius:0 7px 7px 0;color:#C3CAD9;font-size:11.5px;line-height:1.45}
.rule b{color:var(--ink)}
dialog{border:0;border-radius:14px;background:var(--card);color:var(--ink);max-width:620px;width:92%;padding:16px}
dialog textarea{width:100%;height:260px;background:#222732;color:var(--ink);border:1px solid var(--line);
 border-radius:9px;padding:10px;font:12px/1.4 ui-monospace,monospace}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(max-width:560px){.seg button{width:27px;height:30px}.row{flex-wrap:wrap}.row .to{flex-basis:100%}}
</style></head><body>
<header>
  <div class="wm">SKOPE</div>
  <div class="sub">Turn labels · Vail · B52</div>
  <div class="bar">
    <button class="pill on" data-f="todo">To label</button>
    <button class="pill" data-f="lift">Off the lifts</button>
    <button class="pill" data-f="run">Run to run</button>
    <button class="pill" data-f="solo">Only one way on</button>
    <button class="pill" data-f="all">Everything</button>
    <button class="pill" data-f="bad">Not a real route</button>
    <input class="s" id="q" placeholder="Find a run…">
  </div>
  <div class="prog"><i id="pi"></i></div>
  <div class="key" id="key"></div>
</header>
<main id="m"></main>
<footer>
  <span class="n" id="n"></span>
  <button class="ghost" id="clear">Clear all</button>
  <button id="exp">Export labels</button>
</footer>
<dialog id="dlg"><b>Turn labels</b><p style="color:var(--mut);font-size:12px">Copy this and keep it with your export.</p>
<textarea id="out" readonly></textarea>
<div style="display:flex;gap:8px;margin-top:10px"><button id="cp" style="background:var(--acc);border:0;color:#2A2018;font-weight:700;border-radius:9px;padding:9px 15px;cursor:pointer">Copy</button>
<button id="cl" style="background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:9px;padding:9px 15px;cursor:pointer">Close</button></div></dialog>

if(_mig) try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}
let filter='todo', q='';
const kid=(g,r)=>g.id+'|'+r.to;

function labelOf(g,r){ return saved[kid(g,r)] || (r.auto||null); }
function isTodo(g,r){ return !saved[kid(g,r)] && !r.auto && !rejects[kid(g,r)]; }

function render(){
  const m=document.getElementById('m'); m.innerHTML='';
  let shown=0;
  DATA.groups.forEach(g=>{
    if(filter==='lift'&&g.kind!=='lift') return;
    if(filter==='run'&&g.kind!=='run') return;
    let rows=g.rows.filter(r=>{
      if(filter==='todo'&&!isTodo(g,r)) return false;
      if(filter==='solo'&&!r.solo) return false;
      if(filter==='bad'&&!rejects[kid(g,r)]) return false;
      if(q){ const s=(g.from+' '+r.to).toLowerCase(); if(!s.includes(q)) return false; }
      return true;
    });
    if(!rows.length) return;
    shown+=rows.length;
    const el=document.createElement('div'); el.className='grp';
    el.innerHTML='<div class="gh"><span class="tag '+(g.kind==='lift'?'lift':'')+'">'+
      (g.kind==='lift'?'lift':'run')+'</span><b>'+esc(g.from)+'</b>'+
      (g.at?'<span class="at">'+esc(g.at)+'</span>':'')+
      '<span class="ct">'+g.rows.length+' way'+(g.rows.length===1?'':'s')+' on</span></div>'+'<div class="frame">'+(g.kind==='lift'
  ? 'Facing the way the lift set you down \u00b7 straight = directly down the fall line \u00b7 slot 3 and 5 are VEER'
  : 'Facing the way you are already skiing \u00b7 straight = the same path, new name \u00b7 slot 3 and 5 are MERGE')+'</div>';
    rows.forEach(r=>{
      const cur=labelOf(g,r), isAuto=!saved[kid(g,r)]&&r.auto, bad=!!rejects[kid(g,r)];
      const row=document.createElement('div');
      row.className='row'+(cur?' done':'')+(bad?' bad':'');
      const DN={e:'Green',m:'Blue',b:'Black',x:'Double black',rg:'Green road',rb:'Blue road',rk:'Black road',p:'Terrain park',q:'No difficulty on file'};
      row.innerHTML='<div class="to"><i class="d '+r.d+'" title="'+DN[r.d]+'"></i><span>'+esc(r.to)+'</span>'+
        '<em class="u">'+r.n+'</em></div>';
      const seg=document.createElement('div'); seg.className='seg';
      lbls(g).forEach((L,i)=>{
        const b=document.createElement('button');
        b.innerHTML=GLY[i]; b.title=(g.kind==='lift'?NM_LIFT:NM_RUN)[i];
        if(cur===L&&!bad) b.className=isAuto?'auto':'on';
        if(bad) b.disabled=true;
        b.onclick=()=>{ if(saved[kid(g,r)]===L) delete saved[kid(g,r)]; else saved[kid(g,r)]=L; save(); render(); };
        seg.appendChild(b);
      });
      row.appendChild(seg);
      const x=document.createElement('button');
      x.className='x'+(bad?' on':''); x.innerHTML='\u2715';
      x.title=bad?'Put this route back':'Not a real route \u2014 take it out';
      x.onclick=()=>{ if(rejects[kid(g,r)]) delete rejects[kid(g,r)];
        else { rejects[kid(g,r)]=1; delete saved[kid(g,r)]; } save(); render(); };
      row.appendChild(x); el.appendChild(row);
    });
    m.appendChild(el);
  });
  if(!shown) m.innerHTML='<div class="grp"><div class="gh"><b>Nothing left here.</b></div></div>';
  const done=DATA.groups.reduce((a,g)=>a+g.rows.filter(r=>!isTodo(g,r)).length,0);
  document.getElementById('pi').style.width=(100*done/DATA.tot).toFixed(1)+'%';
  const nb=Object.keys(rejects).length;
  document.getElementById('n').textContent=done+' of '+DATA.tot+' handled \u00b7 '+
    Object.keys(saved).length+' by you, '+DATA.auto+' filled in'+(nb?', '+nb+' taken out':'');
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(saved));localStorage.setItem(RKEY,JSON.stringify(rejects))}catch(e){} }
document.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('on'));
  p.classList.add('on'); filter=p.dataset.f; render(); });
document.getElementById('q').oninput=e=>{q=e.target.value.trim().toLowerCase(); render();};
document.getElementById('clear').onclick=()=>{ if(confirm('Clear every label you have set? The pre-filled ones stay.')){saved={};save();render();} };
document.getElementById('exp').onclick=()=>{
  const out={v:1,build:DATA.build,when:new Date().toISOString(),turns:{},not_a_route:Object.keys(rejects)};
  DATA.groups.forEach(g=>g.rows.forEach(r=>{
    const L=labelOf(g,r); if(L) out.turns[kid(g,r)]=L; }));
  document.getElementById('out').value=JSON.stringify(out,null,1);
  document.getElementById('dlg').showModal();
};
document.getElementById('cp').onclick=()=>{document.getElementById('out').select();document.execCommand('copy');};
document.getElementById('cl').onclick=()=>document.getElementById('dlg').close();
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  const n=parseInt(e.key,10);
  if(isNaN(n)) return;
  const rows=[...document.querySelectorAll('.row')];
  const first=rows.find(r=>!r.classList.contains('done'));
  if(!first) return;
  const b=first.querySelectorAll('.seg button')[n-1];
  if(n>=1&&n<=7&&b) b.click();
});
const NAMES=['U-turn left','Left','Veer \u00b7 merge left','Straight','Veer \u00b7 merge right','Right','U-turn right'];
document.getElementById('key').innerHTML=GLY.map((g,i)=>
  '<b class="g">'+g+'</b> '+NAMES[i]).join(' \u00b7 ')+
  ' &nbsp;\u00b7&nbsp; keys 1\u20137, 0 clears'+
  '<div class="rule"><b>Off a lift</b>, straight means the run drops directly down the fall line from where you unload, like Forever off the top of #11, and a slight bend is a <b>veer</b> \u2014 Faro off the top of #2.<br><b>Run to run</b>, straight means the same path down with only the name changing, like Riva Ridge into Tourist Trap, and a slight bend is a <b>merge</b> \u2014 Poppyfields West into Poppyfields.</div>';
render();
</script></body></html>
