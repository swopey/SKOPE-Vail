<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SKOPE · Onboarding</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--fieldTop:#E1DEEF;--field:#E4E1F1;--fieldLow:#E9E7F6;--bloom:#E6D7D7;
 --ink:#2D2A45;--mut:#7B7793;--line:rgba(45,42,69,.11);--surf:#FFFFFF;
 --acc:#C06A34;--sel:#CE8B71;--inv:#2D2A45;--invInk:#EDEBF6;
 --e:#529A64;--m:#5B8FC7;--b:#23262E;--x:#9AA0AF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--ink);
 background:radial-gradient(58% 22% at 86% 6%,var(--bloom) 0%,rgba(230,215,215,0) 72%),
 linear-gradient(178deg,var(--fieldTop) 0%,var(--field) 46%,var(--fieldLow) 100%);
 font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
 padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 20px)}
.ptitle{font-family:Montserrat,sans-serif;font-weight:800;font-size:21px;letter-spacing:.045em;
 text-transform:uppercase;white-space:nowrap;line-height:1;margin-bottom:16px}
.prog{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:18px;min-height:16px}
.rail{display:flex;gap:4px;width:172px}
.seg{height:3px;flex:1;border-radius:2px;background:rgba(45,42,69,.14)}
.seg.on{background:var(--acc)}
.back{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:4px;
 color:var(--mut);font-family:Montserrat,sans-serif;font-weight:800;font-size:10px;letter-spacing:.14em;
 text-transform:uppercase;cursor:pointer}
.back i{font-style:normal;font-size:13px;line-height:1;position:relative;top:-.5px}
.eyebrow{font-family:Montserrat,sans-serif;font-weight:800;font-size:10px;letter-spacing:.15em;padding-left:.15em;
 text-transform:uppercase;color:var(--acc);margin-bottom:8px}
h1{font-family:Montserrat,sans-serif;font-weight:800;font-size:17.5px;letter-spacing:.055em;line-height:1.1;
 text-transform:uppercase;margin:0}
.sub{color:#5D5977;font-size:13px;font-weight:500;line-height:1.5;margin:8px 0 0}
.pm{display:inline-block;align-self:flex-start;margin-top:6px;font-family:Montserrat,sans-serif;font-weight:800;font-size:8px;
 letter-spacing:.11em;text-transform:uppercase;color:var(--mut);border:1px solid rgba(123,119,147,.30);
 border-radius:6px;padding:3px 6px 2px}
.flow{flex:1;margin-top:14px;padding-bottom:8px}
.slab{font-family:Montserrat,sans-serif;font-weight:800;font-size:10px;letter-spacing:.13em;padding-left:.13em;
 text-transform:uppercase;color:var(--mut);margin:16px 0 8px;display:flex;align-items:baseline;gap:8px}
.slab .g{flex:1}
.foot{margin-top:auto;padding-top:14px}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:14px;padding:15px 0;background:var(--inv);
 color:var(--invInk);font-family:Montserrat,sans-serif;font-weight:800;font-size:11.5px;letter-spacing:.14em;
 padding-left:.14em;text-transform:uppercase;cursor:pointer}
.btn[disabled]{opacity:.35}
.btn.ghost{background:transparent;color:var(--mut);border:1px solid rgba(45,42,69,.20);margin-top:9px}
.fld{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:9px 13px;margin-bottom:8px}
.fld .k{font-family:Montserrat,sans-serif;font-weight:800;font-size:8.5px;letter-spacing:.13em;
 text-transform:uppercase;color:var(--mut)}
.fld input{width:100%;border:0;background:transparent;outline:none;color:var(--ink);margin-top:2px;-webkit-appearance:none;
 font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;letter-spacing:.07em;text-transform:uppercase}
.rows{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.rw{display:flex;align-items:center;width:100%;background:var(--surf);border:1px solid var(--line);
 border-radius:13px;padding:13px 14px;font-family:Montserrat,sans-serif;font-weight:800;font-size:9.5px;
 letter-spacing:.05em;line-height:1.3;text-transform:uppercase;cursor:pointer}
.rw.on{background:var(--sel);border-color:var(--sel);color:var(--invInk)}
.rw .g{flex:1}
.rw .lifts2{display:block;font-family:ui-sans-serif,system-ui,sans-serif;font-weight:500;letter-spacing:0;
 text-transform:none;font-size:11px;color:var(--mut);margin-top:3px}
.rw.on .lifts2{color:#F3E4DC}
.half{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.third{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}
.third .rw{justify-content:center;padding:13px 8px;text-align:center}
.third .rw .g{flex:0 1 auto}
.tier{background:var(--surf);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.tier .hd{display:flex;align-items:center;gap:9px;padding:11px 13px}
.em{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;
 font-size:10px;flex:0 0 20px}
.em.e{background:rgba(82,154,100,.16);color:var(--e)}.em.m{background:rgba(91,143,199,.16);color:var(--m)}
.em.b{background:rgba(35,38,46,.12);color:var(--b)}.em.x{background:rgba(154,160,175,.22);color:#6E7482;font-size:8px}
.tier .nm{font-family:Montserrat,sans-serif;font-weight:800;font-size:12px;letter-spacing:.09em;
 text-transform:uppercase;flex:1}
.tier .nm.e{color:var(--e)}.tier .nm.m{color:var(--m)}.tier .nm.b{color:var(--b)}.tier .nm.x{color:#7C8290}
.tier .body{padding:0 13px 11px}
.pk{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-top:1px solid var(--line);
 font-size:13px;font-weight:600;line-height:1.35;cursor:pointer}
.box{width:20px;height:20px;flex:0 0 20px;border-radius:6px;border:1.5px solid rgba(45,42,69,.28)}
.box.on{background:var(--sel);border-color:var(--sel)}
.box.on:after{content:"\2713";color:var(--invInk);font-size:11px;display:block;text-align:center;line-height:17px}
.branch{display:flex;align-items:center;gap:12px;width:100%;background:rgba(206,139,113,.10);
 border:1.5px dashed rgba(206,139,113,.75);border-radius:14px;padding:13px 14px;margin-bottom:12px;cursor:pointer}
.branch .g{flex:1}
.branch .k{font-family:Montserrat,sans-serif;font-weight:800;font-size:8.5px;letter-spacing:.13em;
 text-transform:uppercase;color:var(--acc)}
.branch .t{font-family:Montserrat,sans-serif;font-weight:800;font-size:11px;letter-spacing:.05em;
 text-transform:uppercase;margin-top:3px}
.ramp .track{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:8px}
.ramp .stop{flex:1;padding:11px 2px;text-align:center;font-family:Montserrat,sans-serif;font-weight:800;
 font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);border-right:1px solid var(--line);cursor:pointer}
.ramp .stop:last-child{border-right:0}
.ramp .stop.on{background:var(--sel);color:var(--invInk)}
.ends{display:flex;justify-content:space-between;margin-top:6px;font-size:11.5px;color:var(--mut)}
.stmt{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 12px 11px;margin-bottom:8px}
.stmt .tag{font-family:Montserrat,sans-serif;font-weight:800;font-size:8.5px;letter-spacing:.13em;
 text-transform:uppercase;color:var(--acc);margin-bottom:5px}
.stmt .txt{font-size:13.5px;font-weight:600;line-height:1.35}
.scale{display:flex;gap:5px;margin-top:9px}
.scale div{flex:1;height:40px;display:flex;align-items:center;justify-content:center;text-align:center;
 border:1px solid var(--line);border-radius:12px;background:#FAF9FD;font-family:Montserrat,sans-serif;
 font-weight:800;font-size:7.5px;letter-spacing:.05em;line-height:1.25;text-transform:uppercase;color:var(--mut);cursor:pointer}
.scale div.on{background:var(--sel);color:var(--invInk);border-color:var(--sel)}
.tm{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px 13px;margin-bottom:8px}
.tm .hd{display:flex;justify-content:space-between;align-items:baseline}
.tm .k{font-family:Montserrat,sans-serif;font-weight:800;font-size:9.5px;letter-spacing:.13em;
 text-transform:uppercase;color:var(--mut)}
.tm .v{font-family:Montserrat,sans-serif;font-weight:800;font-size:14px}
input[type=range]{-webkit-appearance:none;width:100%;height:28px;margin:9px 0 0;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:28px;border-radius:14px;background:#F1EFF8}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:14px;
 background:var(--sel);border:0}
input[type=range]::-moz-range-track{height:28px;border-radius:14px;background:#F1EFF8}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:14px;background:var(--sel)}
.grp{font-family:Montserrat,sans-serif;font-weight:800;font-size:9.5px;letter-spacing:.13em;
 text-transform:uppercase;color:var(--mut);margin:20px 0 9px}
.path{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:11px 12px 10px;
 margin-bottom:12px;cursor:pointer}
.path.on{background:var(--sel);border-color:var(--sel);color:var(--invInk)}
.path .tl{font-family:Montserrat,sans-serif;font-weight:800;font-size:8.5px;letter-spacing:.14em;
 text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.path.on .tl,.path.on .mi{color:#F6EAE3}
.path .hd{display:flex;align-items:baseline;justify-content:space-between}
.path .nm{font-family:Montserrat,sans-serif;font-weight:800;font-size:11px;letter-spacing:.09em;text-transform:uppercase}
.path .mi{font-family:Montserrat,sans-serif;font-weight:800;font-size:9.5px;letter-spacing:.08em;color:var(--mut)}
.steps{margin-top:8px;display:flex;flex-direction:column}
.chip{display:flex;align-items:center;gap:6px;width:100%;border-radius:9px;padding:6px 9px;
 border:2px solid rgba(255,255,255,.62);font-family:Montserrat,sans-serif;font-weight:800;font-size:10px;
 letter-spacing:.07em;text-transform:uppercase;color:#F7F8FB;line-height:1.1;white-space:nowrap;overflow:hidden}
.chip .sym{display:inline-flex;align-items:center;flex:0 0 auto;line-height:0}
.chip .sym svg{display:block}
.chip .road{font-size:7.5px;letter-spacing:.1em;opacity:.8;margin-left:auto;padding-left:8px}
.chip.e{background:var(--e)}.chip.m{background:var(--m)}.chip.b{background:var(--b)}
.chip.x{background:#C6C9D2;color:#1D2029;border-color:rgba(0,0,0,.42)}
.chip.rg{background:var(--e);border-style:dashed}.chip.rb{background:var(--m);border-style:dashed}
.chip.rk{background:var(--b);border-style:dashed}
.arw{height:13px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--mut)}
.path.on .arw{color:#F3E0D6}
.day{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;
 margin-bottom:11px;cursor:pointer}
.day.on{background:var(--sel);border-color:var(--sel);color:var(--invInk)}
.day .nm{font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.dhd{display:flex;align-items:center;gap:10px}
.dhd .nm{flex:1}
.dif{display:flex;gap:4px;flex:0 0 auto}
.dpill{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;
 font-size:9px;color:#F7F8FB;line-height:1}
.dpill.e{background:var(--e)}.dpill.m{background:var(--m)}.dpill.b{background:var(--b)}
.dpill.x{background:#C6C9D2;color:#1D2029;font-size:7px;width:26px;letter-spacing:0}
.day.on .dpill{box-shadow:0 0 0 1.5px rgba(255,255,255,.55)}
.day .stats{display:flex;gap:16px;margin-top:11px}
.day .st .n{font-family:Montserrat,sans-serif;font-weight:800;font-size:16px}
.day .st .l{font-family:Montserrat,sans-serif;font-weight:700;font-size:8.5px;letter-spacing:.12em;
 text-transform:uppercase;color:var(--mut);margin-top:2px}
.day.on .st .l,.day.on .ln{color:#F3E4DC}
.lifts3{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.lift{background:#F1EFF8;border-radius:8px;padding:4px 8px;font-family:Montserrat,sans-serif;font-weight:800;
 font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:#5D5977}
.day.on .lift{background:rgba(255,255,255,.22);color:var(--invInk)}
.day .ln{font-size:12.5px;font-weight:500;line-height:1.5;color:var(--mut);margin-top:8px;padding-top:9px;
 border-top:1px solid var(--line)}
.day.on .ln{border-color:rgba(255,255,255,.28)}
.bio{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px 15px 14px}
.bio .kick{font-family:Montserrat,sans-serif;font-weight:800;font-size:9px;letter-spacing:.14em;
 text-transform:uppercase;color:var(--acc);margin-bottom:7px}
.bio .type{font-family:Montserrat,sans-serif;font-weight:800;font-size:19px;letter-spacing:.05em;
 text-transform:uppercase;line-height:1.15}
.bio p{margin:11px 0 0;font-size:13.5px;font-weight:500;line-height:1.55;color:#4A4663}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
.tag2{background:var(--sel);color:var(--invInk);border-radius:9px;padding:5px 9px;font-family:Montserrat,sans-serif;
 font-weight:800;font-size:8.5px;letter-spacing:.09em;text-transform:uppercase}

const app = document.getElementById("app");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const beginner = () => A.never === true;

/* the numeric keypad has no slash key, so the field puts them in */
function dob(el){
 const d=el.value.replace(/\D/g,"").slice(0,8);
 let out=d.slice(0,2);
 if(d.length>2) out+=" / "+d.slice(2,4);
 if(d.length>4) out+=" / "+d.slice(4,8);
 el.value=out; A.dob=out;
 try{ el.setSelectionRange(out.length,out.length); }catch(e){}
}
function pick(k,v){ A[k]= (k==="asJson") ? (v.indexOf("rule book")>=0) : v;
 if(k==="stay"&&STAY[v]){ A.start=STAY[v].start.slice(); A.finish=STAY[v].finish.slice(); }
 if(k==="freq"){ A.never = (v==="First time ever") ? true : null;
  if(A.never){ A.clock.from=18; A.clock.to=62; } }
 render(); }
function tog(k,v){ const i=A[k].indexOf(v); i<0?A[k].push(v):A[k].splice(i,1);
 if(k==="start"&&newHere()) A.finish=A.start.slice();
 render(); }
function tierT(k,v){ A.cap[k]=A.cap[k]||[]; const i=A.cap[k].indexOf(v); i<0?A.cap[k].push(v):A.cap[k].splice(i,1); render(); }

function clockTime(p){const m=8.5*60+p/100*(16*60-8.5*60);const H=Math.floor(m/60);let M=Math.round((m%60)/5)*5;
 let h=H; if(M===60){M=0;h=H+1;} return ((h%12)||12)+":"+String(M).padStart(2,"0")+(h<12?"am":"pm");}
function clockLabel(k){const v=A.clock[k];
 if(k==="from") return v<4?"First Chair":clockTime(v);
 if(k==="to")   return v>96?"Last Chair":clockTime(v);
 if(k==="plan") return v<33?"Rarely":v>66?"Always":"Sometimes";
 return v<33?"Hardly any":v>66?"Plenty":"A couple";}
function cur(){ return S()[step]; }
function go(d){ step=Math.max(0,Math.min(S().length-1,step+d)); window.scrollTo(0,0); render(); }

function tier(k,v){ A.cap[k]=A.cap[k]||[]; const i=A.cap[k].indexOf(v); i<0?A.cap[k].push(v):A.cap[k].splice(i,1); render(); }

function profile(){
 const s=A.stmt, n=A.nick||A.name||"You", g=k=>((s[k]==null?2:s[k])+1);
 const tiers=["Green","Blue","Black","Double black"];
 const topTier=[...tiers].reverse().find(t=>(A.cap[t]||[]).length);
 const picks=topTier?(A.cap[topTier]||[]).filter(x=>x.indexOf("Keep")<0):[];
 const many=A.areas.length>=5, coverage=A.days.length>=4;

 /* two-trait names first, single traits after */
 const NAMES=[
  ["The Dawn Patroller", g("Powder")>=5 && A.clock.from<20],
  ["The Storm Chaser",   g("Powder")>=5 && g("Nerve")>=4],
  ["The Corduroy Chaser",g("Grooming")>=4 && g("Speed")>=4],
  ["The Glade Runner",   g("Trees")>=5],
  ["The Mogul Masher",   g("Bumps")>=5],
  ["The Park Rat",       g("Park")>=4],
  ["The Crowd Dodger",   g("Lift lines")>=5],
  ["The Long Way Round", g("Scenery")>=5 && g("Speed")<=3],
  ["The Leg Burner",     g("Effort")>=5 && g("Lunch")<=2],
  ["The Mountain Wanderer", g("Ambition")>=5 && many],
  ["The Long Luncher",   g("Lunch")>=5],
  ["The Full Sweep",     coverage],
  ["The Zone Regular",   !many && A.areas.length && A.areas.length<=2],
  ["The Bowl Regular",   A.areas.indexOf("Back Bowls")>=0 && g("Powder")>=4],
  ["The All-Mountain Skier", true]
 ];
 let type = beginner() ? "The First Timer" : NAMES.find(x=>x[1])[0];

 const p=[];
 if(TYPELINE[type]) p.push(TYPELINE[type]);
 if(beginner()){
  p.push("You have never skied, and the plan knows it. Everything stays green, everything stays near a lift, and nothing on it will surprise you.");
  if(A.lesson==="Not yet"||A.lesson==="Someone is teaching me"){
   p.push(g("Nerve")<=2
    ? "Book a lesson before anything else. A morning with an instructor is the difference between a first day you repeat and one you do not, and SKOPE will plan around the meeting point."
    : "Worth booking a lesson for the first morning. SKOPE will plan around the meeting point and pick the day up afterwards.");
  } else if(A.lesson){
   p.push("Your "+A.lesson.toLowerCase()+" lesson comes first, and the plan is built around where it finishes.");
  }
 } else {
  const low=x=>x.charAt(0).toLowerCase()+x.slice(1);
  const three=picks.slice(0,3).map(low).map(x=>x.replace(", natural obstacles"," and natural obstacles"));
  p.push("You top out at "+topTier.toLowerCase()+
   (three.length? ", and inside that you take "+
     (three.length>1? three.slice(0,-1).join(", ")+" and "+three[three.length-1] : three[0])+"." : "."));
  /* the cap is a CEILING, not a diet: say what stays in */
  const groomed=tiers.filter(t=>(A.cap[t]||[]).some(x=>/^Groomed/.test(x)))
    .map(t=>t.toLowerCase()+"s").filter(t=>t!==topTier.toLowerCase()+"s");
  const kept=[];
  if(groomed.length) kept.push("groomed "+(groomed.length>1? groomed.slice(0,-1).join(", ")+" and "+groomed[groomed.length-1] : groomed[0]));
  const others=tiers.filter(t=>t!==topTier && (A.cap[t]||[]).some(x=>!/^Groomed|^Keep/.test(x))).length;
  if(kept.length||others) p.push("That is the ceiling, not the diet. "+
   (kept.length? kept[0].charAt(0).toUpperCase()+kept[0].slice(1)+" stay in every plan" : "Everything below it stays in play")+
   ", and a soft day still gets you the easy stuff.");
  if(A.avoid.length) p.push("Out of a normal day: "+A.avoid.map(x=>x.charAt(0).toLowerCase()+x.slice(1)).join(", ")+
   ". SKOPE will still ask before it stretches you.");
 const outs=tiers.flatMap(t=>(A.cap[t]||[]).filter(x=>/^Keep/.test(x)));
  if(outs.length) p.push("The only things kept out: "+outs.map(x=>x.replace(/^Keep (the )?/,"").replace(" out of my day","").replace(" out unless there is no way around"," unless there is no way around")).join(", ")+".");
 }
 if(A.kit==="I need to pick something up") p.push("You have gear to collect, so DAY ONE starts at a shop rather than a lift. SKOPE allows the time it really takes, once.");
 const want=[];
 if(g("Powder")>=4) want.push("first tracks after a storm");
 if(g("Grooming")>=4) want.push("the grooming report");
 if(g("Bumps")>=4) want.push("bumps");
 if(g("Trees")>=4) want.push("trees");
 if(g("Park")>=4) want.push("the park");
 if(g("Effort")>=4) want.push("a day you feel in your legs");
 if(g("Scenery")>=4) want.push("a view worth the detour");
 if(g("Speed")>=4) want.push("room to carry speed");
 if(g("Ambition")>=4) want.push(beginner()?"seeing more of the mountain than the beginner area":"something you have not skied before");
 if(g("Lift lines")>=4) want.push(beginner()?"the quiet lifts, away from the crowds":"a lift nobody is on");
 if(want.length) p.push("What you want out of a day: "+want.slice(0,4).join(", ")+".");

 const BASEY=["Vail Village / Mid-Vail","Lionshead","Golden Peak","Avanti","Cascade","Terrain Park"];
 const terrainAreas=A.areas.filter(a=>BASEY.indexOf(a)<0), baseAreas=A.areas.filter(a=>BASEY.indexOf(a)>=0);
 const lead=terrainAreas.length?terrainAreas:A.areas;
 if(A.areas.length) p.push(newHere()
   ? "You have not skied Vail yet, and what you want to see is "+
     A.areas.map(x=>x.charAt(0).toLowerCase()+x.slice(1)).join(" and ")+"."
   : many
   ? "At Vail you ski all of it, and the parts you named first are "+lead.slice(0,4).join(", ")+"."
   : "At Vail that means "+lead.join(" and ")+
     (baseAreas.length&&terrainAreas.length?", off "+baseAreas.slice(0,2).join(" and "):"")+" before anything else.");
 const lunch=[].concat(A.venues,A.baseLunch);
 if(lunch.length && newHere()){
  p.push("For lunch: "+lunch.map(x=>x.charAt(0).toLowerCase()+x.slice(1)).join(", ")+".");
 } else if(lunch.length){
  /* the on-mountain places and the bases are different answers, so both get said */
  const up=A.venues, down=A.baseLunch;
  let t = up.length ? (up.length>2
      ? "Lunch is wherever you are at noon: "+up.join(", ")
      : "Lunch is "+up.join(" or ")) : "";
  if(down.length) t = t
    ? t+", or down at "+down.join(" or ")+" if the day leans that way."
    : "Lunch is down at "+down.join(" or ")+".";
  else t += ".";
  p.push(t);
 }
 const early=A.clock.from<20, late=A.clock.to>80;
 p.push(beginner() ? "A first day is short by design, and SKOPE will keep it that way."
   : early&&late ? "First Chair to Last Chair, every time."
   : early ? "You are there for First Chair." : late ? "You stay until they stop spinning." : "");

 const tags=[];
 if(topTier) tags.push(topTier);
 [["Powder","Powder"],["Grooming","Groomers"],["Bumps","Bumps"],["Trees","Trees"],["Park","Park"],
  ["Effort","Big days"],["Scenery","Views"],["Speed","Speed"],["Ambition","New terrain"],
  ["Lift lines","Quiet lifts"],["Nerve","No nerves"]].forEach(([k,label])=>{ if(g(k)>=5) tags.push(label); });
 A.areas.slice(0,2).forEach(a=>tags.push(a));
 return {type,p:p.filter(Boolean),tags:tags.slice(0,8),n};
}

 const band={Green:1,Blue:2,Black:3,"Double black":4}[top]||(beginner()?0:2);

   '<div class="rows">'+["Mostly alone","People at about my level","People better than me",
     "People I am looking after","Kids"]
    .map(x=>row(x,A.crew.indexOf(x)>=0,"tog","crew")).join('')+'</div>'+
   '<p class="sub">Usually, not always. You can change it on any given day.</p>'+
   '<div class="slab"><span class="g">Your gear</span><span class="pm">Pick one</span></div>'+
   '<div class="rows">'+[
     ["I own everything","Straight to the lift"],
     ["I need to pick something up","Day one starts at the shop"]
    ].map(([x,w])=>row(x,A.kit===x,"pick","kit",w)).join('')+'</div>'+
   '</div>'+
   foot("Next",!!(A.freq&&A.know&&A.kit));
 }

 if(k==="cap"){
  const T=[["e","\u25CF","Green",["Groomed green runs","Green cat tracks, the long flat ones","Keep the multi-mile green roads out of my day"]],
           ["m","\u25A0","Blue",["Groomed blues","Blue cat tracks","Blues that bump up when it has not snowed","Keep long blue roads out unless there is no way around"]],
           ["b","\u25C6","Black",["Groomed blacks","Blacks bumped up when it has not snowed","Blacks with fresh snow on them","Black tree runs","Black cat tracks, the way out of a bowl or into somewhere good"]],
           ["x","\u25C6\u25C6","Double black",["Long steep mogul fields","Thin cover, natural obstacles","Cliffs and drops","Anything that is open"]]];
  h=head("What you can ski, and what kind","What are you capable of?","","Pick any, in every tier")+
   '<div class="flow">'+
   '<div class="branch" onclick="neverPath()"><div class="g"><div class="k">Never skied or ridden?</div>'+
     '<div class="t">Start here instead</div></div><div style="font-size:15px;color:var(--acc)">\u203A</div></div>'+
   T.map(([c,sy,name,opts])=>'<div class="tier"><div class="hd"><div class="em '+c+'">'+sy+'</div>'+
     '<div class="nm '+c+'">'+name+'</div></div><div class="body">'+
     opts.map(o=>'<div class="pk" data-v="'+attr(o)+'" data-t="'+attr(name)+'" '+
       'onclick="tierT(this.dataset.t,this.dataset.v)">'+
       '<div class="box'+((A.cap[name]||[]).indexOf(o)>=0?' on':'')+'"></div><div>'+o+'</div></div>').join('')+
     '</div></div>').join('')+
   '<div class="slab"><span class="g">On a run at your limit</span><span class="pm">Pick one</span></div>'+
   '<div class="ramp"><div class="track">'+[0,1,2,3,4].map(i=>
     '<div class="stop'+(A.control===i?' on':'')+'" onclick="pick(\'control\','+i+')">'+(i+1)+'</div>').join('')+'</div>'+
     '<div class="ends"><span>Careful and patient</span><span>Confident anywhere</span></div></div>'+
   '</div>'+foot("Next", Object.values(A.cap).some(v=>v.length) && A.control!=null);
 }

 if(k==="never"){
  h=head("First time ever","Let\u2019s start somewhere else","","")+
   '<div class="flow">'+
   '<div class="slab"><span class="g">How will you take to it?</span><span class="pm">Pick one</span></div>'+
   '<div class="rows">'+["I have athletic experience","I have confidence I\u2019ll pick it up","I\u2019m honestly nervous"]
     .map(x=>row(x,A.athletic===x,"pick","athletic")).join('')+'</div>'+
   '<div class="slab"><span class="g">Anything close to this?</span><span class="pm">Pick any</span></div>'+
   '<div class="rows">'+["I skate or surf","I water ski","I have been on a mountain bike","None of these"]
     .map(x=>row(x,A.related.indexOf(x)>=0,"tog","related")).join('')+'</div>'+
   '<div class="slab"><span class="g">Have you booked a lesson?</span><span class="pm">Pick one</span></div>'+
   '<div class="half">'+["Full day","Half day","Not yet","Someone is teaching me"]
     .map(x=>row(x,A.lesson===x,"pick","lesson")).join('')+'</div>'+
   '</div>'+foot("Next",!!A.athletic);
 }

 if(k==="stmtA"||k==="stmtB"){
  const list = beginner() ? STMT.filter(s=>BEGINNER_STMT.indexOf(s[0])>=0)
                          : (k==="stmtA"?STMT.slice(0,6):STMT.slice(6));
  const eb = beginner() ? "Five quick ones" : (k==="stmtA"?"One through six":"Seven through twelve");
  const last = beginner() || k==="stmtB";
  h=head(eb,"Agree or disagree?","","One answer each")+
   '<div class="flow">'+list.map(([tag,txt])=>
    '<div class="stmt"><div class="tag">'+tag+'</div><div class="txt">'+txt+'</div><div class="scale">'+
    ["Disagree","Somewhat<br>disagree","Neutral","Somewhat<br>agree","Agree"].map((L,i)=>
     '<div class="'+(A.stmt[tag]===i?'on':'')+'" data-t="'+attr(tag)+'" onclick="stmt(this.dataset.t,'+i+')">'+L+'</div>').join('')+
    '</div></div>').join('')+
   (last ? '<div class="slab"><span class="g">And anything you will not do?</span><span class="pm">Pick any</span></div>'+
     '<div class="rows">'+[
       ["Moguls","Leave the bumped-up runs out"],
       ["Trees","Keep me out of the glades"],
       ["Cliffs and drops","Nothing with air in it"],
       ["Long cat tracks","Only when there is no way around"],
       ["Crowded runs","Even if it means a longer way"],
       ["The terrain park","Not my thing"],
       ["Flat light above the trees","The bowls on a grey day"],
       ["Nothing, I am open","Put whatever in front of me"]
      ].map(([x,w])=>row(x,A.avoid.indexOf(x)>=0,"tog","avoid",w)).join('')+'</div>'+
     '<p class="sub">Soft, not permanent. SKOPE keeps these out of a normal day, and can still offer to stretch you when the conditions are right.</p>' : '')+
   '</div>'+
   foot("Next", list.every(s=>A.stmt[s[0]]!=null));
 }

 if(k==="vail"){
  if(newHere()){
   h=head("Vail","What should SKOPE show you?",
     "You have not skied here before, so names will not help yet. Pick what sounds good and SKOPE will fill in the runs.","Pick any")+
    '<div class="flow">'+
    '<div class="rows">'+[
      ["The classics","The runs everyone comes here for"],
      ["Stay on the front side","Close to the village, easy to get back"],
      ["The Back Bowls","Wide open, above the trees, no trail signs"],
      ["Blue Sky Basin","The far side, quiet, feels like the backcountry"],
      ["Wherever the snow is best","Let SKOPE decide on the day"]
     ].map(([x,w])=>row(x,A.areas.indexOf(x)>=0,"tog","areas",w)).join('')+'</div>'+
    '<div class="slab"><span class="g">Anywhere you would rather not go?</span><span class="pm">Pick any</span></div>'+
    '<div class="rows">'+[
      ["Anything steep","Keep the pitch gentle"],
      ["The far side of the mountain","Nothing that strands me a long way from the base"],
      ["Crowded parts","Quieter runs even if they are further"],
      ["Nowhere, I am open","Put whatever in front of me"]
     ].map(([x,w])=>row(x,A.avoidAreas.indexOf(x)>=0,"tog","avoidAreas",w)).join('')+'</div>'+
    '<div class="slab"><span class="g">Where are you staying in Vail?</span><span class="pm">Pick one</span></div>'+
    '<div class="rows">'+[
      ["Vail Village","Gondola One, and Golden Peak is a short walk"],
      ["Lionshead","Born Free #8 and the Eagle Bahn"],
      ["Golden Peak","Riva Bahn #6"],
      ["Cascade Village","Cascade #20"],
      ["Off property, driving in","Park at any garage and start wherever suits the day"]
     ].map(([x,w])=>row(x,A.stay===x,"pick","stay",w)).join('')+'</div>'+
    '<p class="sub">You will finish back where you started unless you say otherwise, which is what a first day should do.</p>'+
    '<div class="slab"><span class="g">What kind of lunch?</span><span class="pm">Pick one</span></div>'+
    '<div class="rows">'+[
      ["Somewhere with a view","Up on the mountain, worth the stop"],
      ["Quick, on the move","In and out, back on the snow"],
      ["A proper sit-down","Take the time, warm up"],
      ["Down at the base","Off the hill for it"],
      ["No preference","Wherever you are at noon"]
     ].map(([x,w])=>row(x,A.venues.indexOf(x)>=0,"tog","venues",w)).join('')+'</div>'+
    '</div>'+foot("Next",A.areas.length>0&&!!A.stay);
  } else {
   h=head("Vail","Where do you actually ski?","","Pick any")+
   '<div class="flow">'+
   '<div class="slab" style="margin-top:0"><span class="g">The front side</span><span class="pm">Pick any</span></div>'+
   /* AREA RULE, asymmetric on purpose:
      NORTHEAST BOWL includes Highline, because #10 is largely a people mover for that side.
      HIGHLINE on its own means the expert terrain it serves and nothing else:
      Highline, Blue Ox, Roger's Run, Log Chute, Hairbag Alley. NOT Prima or Pronto,
      which #10 delivers you to the bottom of but which start at the top of 4/5/11.
      Picking Highline is a claim about ability, so it also confirms the cap. */
   '<div class="half">'+["Vail Village / Mid-Vail","Lionshead","Golden Peak","Terrain Park",
     "Avanti","Highline","Game Creek Bowl","Northeast Bowl"]
     .map(x=>row(x,A.areas.indexOf(x)>=0,"tog","areas")).join('')+'</div>'+
   '<div class="slab"><span class="g">And out back</span><span class="pm">Pick any</span></div>'+
   '<div class="half">'+["Sun Down Bowl","Sun Up Bowl","Tea Cup Bowl","China Bowl",
     "Siberia Bowl","Inner Mongolia Bowl","Outer Mongolia Bowl","Blue Sky Basin"]
     .map(x=>row(x,A.areas.indexOf(x)>=0,"tog","areas")).join('')+'</div>'+
   '<div class="slab"><span class="g">Anywhere you would rather not ski?</span><span class="pm">Pick any</span></div>'+
   '<div class="half">'+["Vail Village / Mid-Vail","Lionshead","Golden Peak","Terrain Park","Avanti",
     "Highline","Game Creek Bowl","Northeast Bowl","Sun Down Bowl","Sun Up Bowl","Tea Cup Bowl",
     "China Bowl","Siberia Bowl","Inner Mongolia Bowl","Outer Mongolia Bowl","Blue Sky Basin"]
     .map(x=>row(x,A.avoidAreas.indexOf(x)>=0,"tog","avoidAreas")).join('')+'</div>'+
   '<div class="slab"><span class="g">Where are you staying?</span><span class="pm">Pick one</span></div>'+
   '<div class="rows">'+[
     ["Vail Village","Start here or Golden Peak, finish at Vail Village"],
     ["Golden Peak","Start here or Vail Village, finish at Golden Peak"],
     ["Lionshead","Start and finish at Lionshead"],
     ["Cascade Village","Start and finish at Cascade"],
     ["Off property, driving in","Park anywhere, any base is fair game"]
    ].map(([x,w])=>row(x,A.stay===x,"pick","stay",w)).join('')+'</div>'+
   '<p class="sub">That sets the bases below. Change them if a day calls for it.</p>'+
   '<div class="slab"><span class="g">Where do you start?</span><span class="pm">Pick any</span></div>'+
   '<div class="rows">'+[["Vail Village","Gondola One"],["Golden Peak","Riva Bahn #6 \u00b7 Gopher Hill #12"],
     ["Lionshead","Born Free #8 \u00b7 Eagle Bahn #19"],["Cascade Village","Cascade Village #20"]]
     .map(([x,l])=>row(x,A.start.indexOf(x)>=0,"tog","start",l)).join('')+'</div>'+
   '<div class="slab"><span class="g">Where do you finish?</span><span class="pm">Pick any</span></div>'+
   '<div class="half">'+["Vail Village","Golden Peak","Lionshead","Cascade Village"]
     .map(x=>row(x,A.finish.indexOf(x)>=0,"tog","finish")).join('')+'</div>'+
   '<div class="slab"><span class="g">Where do you eat on the mountain?</span><span class="pm">Pick any</span></div>'+
   '<div class="rows">'+[["Two Elk Lodge","Top of #14"],["Buffalo\u2019s","Top of #4/5/11"],["Mid-Vail","Mid-Vail"],
     ["The 10th","Mid-Vail \u00b7 fine dining"],["Wildwood Smokehouse","Top of #3/7/17"],["Eagle\u2019s Nest","Top of #15/19"],
     ["Belle\u2019s Camp","Top of #37 \u00b7 snacks"],["The Dawg Haus","Base of #39 \u00b7 outside"],
     ["The Coop","Base of #2 \u00b7 outside"]]
     .map(([x,w])=>row(x,A.venues.indexOf(x)>=0,"tog","venues",w)).join('')+'</div>'+
   '<div class="slab"><span class="g">Or down at a base</span><span class="pm">Pick any</span></div>'+
   '<div class="third">'+["Vail Village","Lionshead","Golden Peak"]
     .map(x=>row(x,A.baseLunch.indexOf(x)>=0,"tog","baseLunch")).join('')+'</div>'+
   '</div>'+foot("Next",A.start.length>0);
  }
 }

 if(k==="clock"){
  const tm=(k2,label,lo,hi)=>'<div class="tm"><div class="hd"><div class="k">'+label+'</div>'+
   '<div class="v" id="lab_'+k2+'">'+clockLabel(k2)+'</div></div>'+
   '<input type="range" min="0" max="100" value="'+A.clock[k2]+'" '+
   'oninput="A.clock.'+k2+'=+this.value;document.getElementById(\'lab_'+k2+'\').textContent=clockLabel(\''+k2+'\')">'+
   '<div class="ends"><span>'+lo+'</span><span>'+hi+'</span></div></div>';

  h=head("On an average day","How do you spend the day?","A typical day, not necessarily your best one.","")+
   '<div class="flow">'+
   tm("from","On the hill from","First Chair","Last Chair")+
   tm("to","Until","First Chair","Last Chair")+
   tm("plan","Do you plan lunch ahead?","Eat when I\u2019m hungry","Booked, at a time")+
   tm("breaks","Breaks","Only if it\u2019s freezing","Hot chocolate all day")+
   '</div>'+foot("Next");
 }

 if(k==="line"){
  let last="";
  h=head("Scenario","Which of these can you ski?",
    "You have just ridden Mountain Top Express #4 and you are standing at the top of Vail. These are some of the ways down. You do not need to know the names, go by what is in them.","Pick any")+
   '<div class="flow">'+PATHS.map(([grp,tierL,nm,mi,runs],i)=>{
    const g = grp!==last ? '<div class="grp">'+grp+'</div>' : ''; last=grp;
    return g+'<div class="path'+(A.paths.indexOf(i)>=0?' on':'')+'" onclick="tog(\'paths\','+i+')">'+
     '<div class="tl">'+tierL+'</div><div class="hd"><div class="nm">'+nm+'</div><div class="mi">'+mi+'</div></div>'+
     '<div class="steps">'+runs.map(chip).join('<div class="arw">\u2193</div>')+'</div></div>';
   }).join('')+'</div>'+foot("Next");
 }

 if(k==="days"||k==="daysB"){
  const idx = k==="daysB" ? [0,1] : DAYS.map((d,i)=>i);
  h=head(k==="daysB"?"Your first morning":"Real days, already built",
    k==="daysB"?"Which sounds better?":"Which of these look good?","", "Pick any")+
   '<div class="flow">'+idx.map(i=>{const d=DAYS[i];
    const dif=(DAYDIFF[d[0]]||[]).map(c=>'<span class="dpill '+c+'">'+MARK[c]+'</span>').join('');
    return '<div class="day'+(A.days.indexOf(i)>=0?' on':'')+'" onclick="tog(\'days\','+i+')">'+
     '<div class="dhd"><div class="nm">'+d[0]+'</div><div class="dif">'+dif+'</div></div>'+
     '<div class="stats">'+[d[1],d[2],d[3]].map(x=>{
       const sp=x.split("|"); return '<div class="st"><div class="n">'+sp[0]+'</div><div class="l">'+sp[1]+'</div></div>';}).join('')+
     '</div><div class="lifts3">'+d[4].map(l=>'<span class="lift">'+l+'</span>').join('')+'</div>'+
     '<div class="ln">'+d[5]+'</div></div>';
   }).join('')+'</div>'+foot("Next",A.days.length>0);
 }

 if(k==="profile"){
  const P=profile();
  h=head("That\u2019s everything","Nice to meet you","","")+
   '<div class="flow"><div class="bio"><div class="kick">'+esc(P.n)+'\u2019s SKOPE profile</div>'+
   '<div class="type">'+P.type+'</div>'+P.p.map(x=>'<p>'+esc(x)+'</p>').join('')+
   '<div class="tags">'+P.tags.map(t=>'<span class="tag2">'+esc(t)+'</span>').join('')+'</div></div>'+
   '<p class="sub">Every line came from something you answered.</p></div>'+foot("Next");
 }

 if(k==="save"){
  h=head("Last thing","Send it back","Copy this and text it to whoever sent you the link.","")+
   '<div class="flow"><textarea id="out" readonly>'+esc(A.asJson?JSON.stringify(ruleBook(),null,1):answersText())+'</textarea>'+
   '<div class="rows" style="margin-top:10px">'+
    row("Readable",!A.asJson,"pick","asJson")+row("As the rule book SKOPE reads",!!A.asJson,"pick","asJson")+
   '</div>'+
   '<div class="foot" style="padding-top:12px"><button class="btn" onclick="copyOut()">Copy this</button>'+
   '<button class="btn ghost" onclick="step=0;render()">Start again</button></div></div>';
 }

 app.className = (k==="open") ? "shot" : "";
 app.innerHTML=h;
}
function showJSON(){
 const t=document.getElementById("out");
 t.value=JSON.stringify(ruleBook(),null,1); t.select(); t.setSelectionRange(0,99999);
 try{ document.execCommand("copy"); }catch(e){}
 if(navigator.clipboard) navigator.clipboard.writeText(t.value).catch(()=>{});
 const b=event.target, o=b.textContent; b.textContent="Copied"; setTimeout(()=>b.textContent=o,1400);
}
function copyOut(){
 const t=document.getElementById("out"); t.select(); t.setSelectionRange(0,99999);
 try{ document.execCommand("copy"); }catch(e){}
 if(navigator.clipboard) navigator.clipboard.writeText(t.value).catch(()=>{});
 const b=event.target; const o=b.textContent; b.textContent="Copied"; setTimeout(()=>b.textContent=o,1400);
}
render();
</script>
</body>
</html>
