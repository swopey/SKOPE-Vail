<script>
/* ---- never let anything fail silently ------------------------------------ */
function say(t,bad){ var s=document.getElementById('status');
  if(s){ s.textContent=t; s.className=bad?'bad':''; } }
window.onerror=function(m,src,ln,col){ say('The page hit an error and stopped:\n'+m+'\nline '+ln+
  '\n\nPress "Reset saved data", then reload.',true); };

/* SKOPE run-length matcher, core logic. No DOM in here so it can be tested offline. */

const POSV = ['top','upper','mid','middle','lower','bottom'];      // vertical, orderable
const POSC = ['west','east','north','south','front','back'];        // side, exact match only
const POS = POSV.concat(POSC);
const POSRANK = {top:0, upper:1, mid:2, middle:2, lower:3, bottom:4};

// his difficulty codes -> the OSM piste:difficulty values that can satisfy them
const DIFFOK = {
  easiest:    ['easy','novice'],
  more:       ['intermediate'],
  most:       ['advanced'],
  extreme:    ['expert','freeride'],
  park:       ['easy','novice','intermediate','advanced','expert','freeride',''],
  road_green: ['easy','novice'],
  road_blue:  ['intermediate'],
  road_black: ['advanced']
};

function tidy(s){
  return String(s).toLowerCase()
    .replace(/\u2192|->/g,' to ')
    .replace(/&/g,' and ')
    .replace(/\bn\.\s*/g,'north ').replace(/\bs\.\s*/g,'south ')
    .replace(/\be\.\s*/g,'east ').replace(/\bw\.\s*/g,'west ')
    .replace(/[^a-z0-9 ]/g,' ')
    .replace(/\s+/g,' ').trim();
}
// "tea cup" and "teacup" must collide; so must "look ma" vs "lookma"
function tight(s){ return tidy(s).replace(/ /g,''); }

/* Split a name into its base and its position word.
   "Riva Ridge (top)"  -> {base:'riva ridge', pos:'top'}
   "Riva Ridge Top"    -> {base:'riva ridge', pos:'top'}
   "Silk Road (21 to base of 22)" -> {base:'silk road', pos:null, qual:'21 to base of 22'}  */
function parts(name){
  const m = String(name).match(/^(.*?)\s*\(([^)]*)\)\s*$/);
  if(m){
    const inner = tidy(m[2]);
    if(POS.indexOf(inner) >= 0)
      return {base: tidy(m[1]), pos: inner, vert: POSV.indexOf(inner) >= 0, qual: null};
    return {base: tidy(m[1]), pos: null, qual: inner};
  }
  const t = tidy(name).split(' ');
  if(t.length > 1 && POS.indexOf(t[t.length-1]) >= 0)
    return {base: t.slice(0,-1).join(' '), pos: t[t.length-1],
            vert: POSV.indexOf(t[t.length-1]) >= 0, qual: null};
  return {base: tidy(name), pos: null, vert: false, qual: null};
}

function metres(g){
  let m = 0;
  for(let i=1;i<g.length;i++){
    const a=g[i-1], b=g[i], R=6371000, r=Math.PI/180;
    const dLat=(b.lat-a.lat)*r, dLon=(b.lon-a.lon)*r, la=(a.lat+b.lat)/2*r;
    const x=dLon*Math.cos(la);
    m += R*Math.sqrt(dLat*dLat + x*x);
  }
  return m;
}

const key = p => p.lat.toFixed(5)+','+p.lon.toFixed(5);

/* Order a set of ways into a single path by shared endpoints.
   Returns {ways, flow} where flow is +1 if walking the chain in this order also
   walks every way the way it was DRAWN, -1 if it walks every one against the
   drawing, and 0 if the drawing is inconsistent. OSM draws a piste downhill, so
   flow=+1 means this order runs top to bottom. Null if the ways are not one chain. */
function chain(ways){
  if(ways.length === 1) return {ways: ways.slice(), flow: 1};
  const ends = {};
  ways.forEach((w,i) => {
    [key(w.geometry[0]), key(w.geometry[w.geometry.length-1])].forEach(k => {
      (ends[k] = ends[k] || []).push(i);
    });
  });
  for(const k in ends) if(ends[k].length > 2) return null;      // a fork, not a chain
  const tips = Object.keys(ends).filter(k => ends[k].length === 1);
  if(tips.length !== 2) return null;                             // a loop or two pieces
  const out = [], seen = new Set();
  let node = tips[0], fwd = 0, bwd = 0;
  while(out.length < ways.length){
    const nx = (ends[node]||[]).filter(i => !seen.has(i));
    if(!nx.length) return null;
    const i = nx[0], w = ways[i];
    seen.add(i); out.push(w);
    const a = key(w.geometry[0]), b = key(w.geometry[w.geometry.length-1]);
    if(a === node) fwd++; else bwd++;
    node = (a === node) ? b : a;
  }
  const flow = bwd === 0 ? 1 : (fwd === 0 ? -1 : 0);
  return {ways: out, flow};
}

/* Collapse consecutive ways that carry the same difficulty into one piece.
   OSM often splits a run more finely than the rating changes. */
function collapse(ordered){
  const out = [];
  for(const w of ordered){
    const last = out[out.length-1];
    if(last && (last.diff||'') === (w.diff||'')) { last.ways.push(w); last.m += w.m; }
    else out.push({diff: w.diff||'', m: w.m, ways: [w]});
  }
  return out;
}

const fits = (mine, osm) => (DIFFOK[mine]||[]).indexOf(osm||'') >= 0;

function score(mineDiffs, pieces){
  if(mineDiffs.length !== pieces.length) return -1;
  let s = 0;
  for(let i=0;i<mineDiffs.length;i++) if(fits(mineDiffs[i], pieces[i].diff)) s++;
  return s;
}

/* ------------------------------------------------------------------ */

function analyse(elements, MINE, aliases, noOsm, manual, shares, hand){
  aliases = aliases || {}; noOsm = noOsm || {}; manual = manual || {}; shares = shares || {};
  hand = hand || {};

  const ways = (elements||[])
    .filter(e => e.type==='way' && e.geometry && e.tags && (e.tags.name||e.tags['piste:name']))
    .map(e => ({
      id: e.id,
      name: (e.tags.name || e.tags['piste:name']).trim(),
      diff: e.tags['piste:difficulty'] || '',
      geometry: e.geometry,
      m: (e.tags['skope:m'] ? +e.tags['skope:m'] : metres(e.geometry))
    }));

  // index OSM ways by exact tidy name and by base
  const byName = {}, byBase = {};
  ways.forEach(w => {
    const p = parts(w.name);
    w.p = p;
    (byName[tight(w.name)] = byName[tight(w.name)] || []).push(w);
    (byBase[tight(p.base)] = byBase[tight(p.base)] || []).push(w);
  });

  // group HIS runs into families by base
  const fam = {};
  Object.keys(MINE).forEach(n => {
    const p = parts(n);
    (fam[tight(p.base)] = fam[tight(p.base)] || []).push({mine: n, ...p, d: MINE[n]});
  });

  const rows = [], families = [], groups = [], missing = [], skipped = [];
  const manualBy = {};                       // your run -> the ways you gave it
  Object.keys(manual).forEach(id => {
    const mine = manual[id];
    (manualBy[mine] = manualBy[mine] || []).push(+id);
  });
  const usedWays = new Set();
  const take = (list, mine, method, note) => {
    list.forEach(w => usedWays.add(w.id));
    const m = list.reduce((a,w)=>a+w.m, 0);
    rows.push({mine, osm: list.map(w=>w.name).filter((v,i,a)=>a.indexOf(v)===i).join(' + '),
               m, ways: list.length, ids: list.map(w=>w.id),
               method, note: note||'', diff: list[0].diff||''});
  };

  Object.keys(fam).forEach(base => {
    const segs = fam[base].slice().sort((a,b) => (POSRANK[a.pos]??9) - (POSRANK[b.pos]??9));

    const strict0 = byBase[base] || [];
    const near0 = ways.filter(w => strict0.indexOf(w) < 0 &&
                  tight(w.p.base).indexOf(base) === 0 && tight(w.p.base) !== base);
    const all = strict0.concat(near0);
    // a split run ALWAYS keeps its review card, however it ends up resolved
    if(segs.length > 1 && all.length) groups.push({base, segs, pool: all, why: ''});

    // 0. a length you measured yourself wins over everything
    segs.filter(s => +hand[s.mine] > 0).forEach(s => rows.push({
      mine: s.mine, osm: 'measured by hand', m: +hand[s.mine] * 1609.344, ways: 0, ids: [],
      method: 'measured', note: 'you measured this on the map', diff: ''}));

    // 1. percentages override everything else for this run
    const sh0 = shares[base];
    const live = segs.filter(s => !noOsm[s.mine] && !(+hand[s.mine] > 0));
    segs.filter(s => noOsm[s.mine] && !(+hand[s.mine] > 0)).forEach(s => skipped.push(s.mine));
    if(!live.length) return;
    if(sh0 && live.length && live.every(s => typeof sh0[s.mine] === 'number') && strict0.length){
      const total = strict0.reduce((a,w) => a + w.m, 0);
      live.forEach(s => rows.push({mine: s.mine, osm: strict0[0].name, m: total*sh0[s.mine]/100,
        ways: strict0.length, ids: strict0.map(w=>w.id), method: 'apportioned',
        note: 'you gave this segment ' + sh0[s.mine] + '% of the run', diff: ''}));
      strict0.forEach(w => usedWays.add(w.id));
      return;
    }

    // 2. anything you assigned by hand, then anything you aliased
    const rest = [];
    live.forEach(s => {
      const ids = manualBy[s.mine];
      if(ids && ids.length){
        const ws = ways.filter(w => ids.indexOf(w.id) >= 0);
        if(ws.length){ take(ws, s.mine, 'manual',
          'you assigned ' + ws.map(w => w.name).filter((v,i,a)=>a.indexOf(v)===i).join(' + ')); return; }
      }
      const al = aliases[s.mine];
      if(al){
        const list = Array.isArray(al) ? al : [al];
        let hit = [];
        list.forEach(nm => { hit = hit.concat(byName[tight(nm)] || byBase[tight(nm)] || []); });
        if(hit.length){ take(hit, s.mine, 'alias', 'you linked this to ' + list.join(' + ')); return; }
      }
      rest.push(s);
    });
    if(!rest.length) return;

    const pool = strict0.filter(w => !manual[w.id]);
    if(!pool.length){ rest.forEach(s => missing.push(s.mine)); return; }

    // 3. percentages already handled above

    // 4. single segment, no split: every way of that name is one run
    if(rest.length === 1 && !rest[0].pos && !rest[0].qual){
      take(pool, rest[0].mine, pool.length > 1 ? 'summed' : 'exact');
      return;
    }

    // 5. position words on both sides. Exact word first, then by order down the hill,
    //    so your top/mid/bottom meets OSM's Upper/Middle/Lower.
    const posWays = pool.filter(w => w.p.pos);
    if(rest.every(s => s.pos) && posWays.length === pool.length){
      const exact = {}; let allExact = true;
      rest.forEach(s => {
        const hit = pool.filter(w => w.p.pos === s.pos);
        if(hit.length) exact[s.mine] = hit; else allExact = false;
      });
      if(allExact){
        rest.forEach(s => take(exact[s.mine], s.mine, 'position', 'OSM names its own segments'));
        return;
      }
      const mineV = rest.every(s => s.vert), osmV = pool.every(w => w.p.vert);
      if(mineV && osmV && pool.length === rest.length){
        const down = pool.slice().sort((a,b) => POSRANK[a.p.pos] - POSRANK[b.p.pos]);
        rest.forEach((s, i) => take([down[i]], s.mine, 'position',
          'your ' + s.pos + ' is OSM\u2019s ' + down[i].p.pos));
        return;
      }
    }

    // 6. chain the ways and lay his segments along them
    const ch = chain(pool);
    if(ch){
      const mineDiffs = rest.map(s => s.d);
      const down = ch.flow >= 0 ? ch.ways : ch.ways.slice().reverse();   // top to bottom
      const cands = [collapse(down), collapse(down.slice().reverse())];
      const scored = cands.map(c => ({c, s: score(mineDiffs, c)}));

      if(ch.flow !== 0 && scored[0].s === mineDiffs.length){
        cands[0].forEach((piece, i) => take(piece.ways, rest[i].mine, 'chained',
          'drawn downhill in OSM, difficulty agrees'));
        return;
      }
      const best = scored.slice().sort((a,b) => b.s - a.s)[0];
      const tie  = scored[0].s === scored[1].s && scored[0].s >= 0;
      if(ch.flow === 0 && best.s === mineDiffs.length && !tie){
        best.c.forEach((piece, i) => take(piece.ways, rest[i].mine, 'chained',
          'ordered by difficulty; OSM drawing direction is inconsistent'));
        return;
      }
      families.push({base, segs: rest, pool, ordered: down, flow: ch.flow, taken: [],
        why: scored[0].s < 0
          ? 'OSM rates this run as ' + collapse(down).length + ' piece' + (collapse(down).length===1?'':'s') + ', you split it into ' + rest.length
          : (ch.flow !== 0
              ? 'drawn direction says one thing and difficulty says another'
              : (tie ? 'both directions fit equally and OSM drew these ways inconsistently \u2014 say which end is the top'
                     : 'difficulty only matches ' + best.s + ' of ' + mineDiffs.length))});
      return;
    }
    families.push({base, segs: rest, pool, ordered: null, flow: 0, taken: [],
      why: 'these ' + pool.length + ' ways do not join into one path'});
  });

  // NOTHING MAY VANISH. Every run must end up somewhere.
  const seen = new Set(rows.map(r => r.mine).concat(missing, skipped));
  families.forEach(f => f.segs.forEach(s => seen.add(s.mine)));
  const lost = Object.keys(MINE).filter(n => !seen.has(n));
  lost.forEach(n => missing.push(n));

  const extra = ways.filter(w => !usedWays.has(w.id));
  const extraByName = {};
  extra.forEach(w => {
    (extraByName[w.name] = extraByName[w.name] || {name: w.name, m: 0, ways: 0, diff: w.diff});
    extraByName[w.name].m += w.m; extraByName[w.name].ways++;
  });

  groups.forEach(g => { const f = families.find(x => x.base === g.base); if(f) g.why = f.why; });
  return {rows, families, groups, missing, skipped, lost,
          extra: Object.values(extraByName).sort((a,b) => b.m - a.m),
          totalWays: ways.length};
}

/* fuzzy suggestions between his unmatched names and the OSM leftovers */
function bigrams(s){ const o=[]; for(let i=0;i<s.length-1;i++) o.push(s.slice(i,i+2)); return o; }
function dice(a,b){
  const A=bigrams(tight(a)), B=bigrams(tight(b));
  if(!A.length||!B.length) return a===b?1:0;
  const pool=B.slice(); let hit=0;
  A.forEach(g=>{ const i=pool.indexOf(g); if(i>=0){hit++; pool.splice(i,1);} });
  return 2*hit/(A.length+B.length);
}
function suggest(missing, extra, n){
  return missing.map(mine => ({
    mine,
    picks: extra.map(e => ({osm: e.name, m: e.m, s: dice(mine, e.name)}))
                .filter(p => p.s > 0.42)
                .sort((a,b) => b.s - a.s)
                .slice(0, n || 3)
  })).filter(x => x.picks.length);
}



/* THE RUN LIST, rebuilt from the B63 index dictionary 2026-08-24. It was the
   pre-B59 list, so it had no Cheetah Gulley, no Minnie's (top) or (mid), no
   Chair 15 Line, no Faro Glade and no Ranger Racoon's Escape, and it still

var MINE={"38":"most","Northwoods":"more","Prima (top)":"extreme","Prima (bottom)":"more","Prima Cornice":"extreme","Pronto":"extreme","Highline":"extreme","Blue Ox":"most","Log Chute":"most","Roger's Run":"most","Hairbag Alley":"most","Flap Jack":"easiest","Klickity Klack":"most","Northface Catwalk (top)":"road_green","Northface Catwalk (bottom)":"road_blue","Riva Ridge (top)":"most","Riva Ridge (mid)":"more","Riva Ridge (bottom)":"more","Riva Glade":"most","Trans Montane":"easiest","Gitalong Road":"road_green","Choker Cut Off":"road_blue","Skid Road (bottom)":"road_green","Skid Road (top)":"road_blue","Brisk Walk":"road_green","Compromise":"road_blue","Cappuccino":"more","Swingsville":"easiest","Christmas":"more","Gandy Dancer":"most","Whistle Pig":"more","Slifer Express":"more","Powerline Glade":"most","Ramshorn":"more","Windows Road (top of 4/5/11)":"road_black","Windows Road (top of 3/7/17)":"road_black","Post Road (upper)":"road_green","Mid-Vail Express":"more","Chair 4 Cliffs":"extreme","Chair 11 Line":"most","Chair 10 Line":"most","Chair 3 Line":"most","Chair 38 Line":"most","Chair 39 Line":"most","Chair 2 Line":"most","Swingsville (upper)":"easiest","Bearclaw Glade":"easiest","Buckskin Glade":"more","Chaos Canyon":"more","Wild Woods":"easiest","The Roost":"easiest","Hideout":"more","Sherwood Forest":"easiest","Thunder Cat Cave":"easiest","Magic Forest":"easiest","Porcupine Alley":"easiest","Coyote's Escape & Den":"easiest","Timberline Catwalk":"road_green","Northstar (top)":"most","Northstar (bottom)":"more","N. Rim":"most","First Step":"most","Snag Park":"more","Sourdough":"easiest","Boomer":"easiest","Tin Pants":"easiest","Whiskey Jack":"more","The Skipper":"most","S. Look Ma":"most","Look Ma":"most","Challenge":"most","Hunky Dory":"more","Kangaroo Cornice":"most","The Meadows":"easiest","Overeasy":"easiest","Avanti (top)":"more","Avanti (mid)":"most","Avanti (bottom)":"more","Eagle's Nest Ridge":"easiest","Pika":"easiest","Cookshack":"most","Pickeroon (t function fetchOSM(){
  var btn=document.getElementById('bFetch'); btn.disabled=true;
  var tried=[], i=0, pairs=[];
  EP.forEach(function(ep){ pairs.push([ep,'POST']); pairs.push([ep,'GET']); });
  function next(){
    if(i>=pairs.length){
      btn.disabled=false;
      var had=useCache(false);
      say('No mirror answered.\n'+tried.join('\n')+'\n\n'+
          (had?'Showing your last saved copy instead.'
              :'Use "Open query in a tab", copy what it returns, then "Paste JSON".'),true);
      return;
    }
    var ep=pairs[i][0], how=pairs[i][1], host=ep.split('/')[2]; i++;
    say('Asking '+host+' by '+how+'\u2026 (up to 20s)\n'+tried.join('\n'));
    var done=false;
    var timer=setTimeout(function(){ if(!done){ done=true;
      tried.push(host+' '+how+': no answer in 20s'); next(); } }, TIMEOUT);
    var opts=(how==='POST')?{method:'POST',body:'data='+encodeURIComponent(Q),
      headers:{'Content-Type':'application/x-www-form-urlencoded'}}:undefined;
    var url=(how==='POST')?ep:ep+'?data='+encodeURIComponent(Q);

            '<td class="num"><input class="pc" style="width:76px;text-align:right" type="number" '+
            'step="0.01" min="0" data-hand="'+esc(s.mine)+'" value="'+
            (S.hand[s.mine]!==undefined?S.hand[s.mine]:'')+'" placeholder="\u2014"></td><td>'+
            (r0?'<span class="tag '+r0.method+'">'+r0.method+'</span> '+mi(r0.m)+' mi'
               :'<span class="tag open">open</span>')+'</td></tr>';
        }).join('')+'</table>'+
        (show?'':'<div class="row"><button data-show="'+esc(g.base)+'">Change it anyway</button></div>')+
        '<div data-body="'+esc(g.base)+'"'+(show?'':' style="display:none"')+'>'+
        '<table style="margin-top:9px"><tr><th>OSM way</th><th>Rating</th><th class="num">Miles</th>'+
        '<th>Belongs to</th></tr>'+
        g.pool.map(function(w){
          var owner=R.rows.filter(function(r){ return r.ids&&r.ids.indexOf(w.id)>=0; })[0];
          var mineOwned=owner&&own.indexOf(owner.mine)>=0;
          return '<tr><td>'+esc(w.name)+'</td><td class="mini">'+
          esc(w.diff||'unrated')+'</td><td class="num">'+mi(w.m)+'</td><td>'+
          '<select data-way="'+w.id+'">'+opts(S.manual[w.id]||'')+'</select>'+
          ((owner&&!mineOwned&&!S.manual[w.id])
            ? '<div class="mini">already measured as '+esc(owner.mine)+'</div>' : '')+
          '</td></tr>'; }).join('')+
        '</table><div class="mini">Or split the whole run by percentage \u2014 '+
        mi(g.pool.reduce(function(a,w){return a+w.m;},0))+' mi in total</div><div class="row">'+
        g.segs.map(function(s){ return '<span><input class="pc" type="number" min="0" max="100" '+
          'style="width:58px" data-pc="'+esc(g.base)+'" data-seg="'+esc(s.mine)+'" value="'+
          (sh[s.mine]!==undefined?sh[s.mine]:'')+'" placeholder="'+even+'"> <span class="mini">% '+
          esc(s.mine)+'</span></span>'; }).join('')+'</div><div class="row">'+
        '<button data-split="'+esc(g.base)+'">Use these percentages</button>'+
        '<button data-clear="'+esc(g.base)+'">Clear this run</button></div></div></div>';
    }).join(''):'<table><tr><th>No split runs to review.</th></tr></table>';
    window.__G=G;
  }else if(TAB==='byhand'){
    var q=(window.__Q||'').toLowerCase();
    var list=Object.keys(MINE).filter(function(n){ return !q||n.toLowerCase().indexOf(q)>=0; });
    h='<div class="card"><div class="mini">Measure it on the map, then type the miles here. '+
      'A value you type wins over OSM, over an alias, over a split — everything.</div>'+
      '<div class="row"><input class="pc" id="q" style="width:100%;max-width:none" '+
      'placeholder="Filter your runs…" value="'+esc(window.__Q||'')+'"></div></div>'+
      '<table><tr><th>Run</th><th class="num">Miles</th><th>Now</th></tr>'+
      list.map(function(n){
        var r0=R?R.rows.filter(function(x){return x.mine===n;})[0]:null;
        return '<tr><td>'+esc(n)+'</td><td class="num">'+
          '<input class="pc" style="width:74px;text-align:right" type="number" step="0.01" min="0" '+
          'data-hand="'+esc(n)+'" value="'+(S.hand[n]!==undefined?S.hand[n]:'')+'" placeholder="—"></td>'+
          '<td>'+(r0?'<span class="tag '+r0.method+'">'+r0.method+'</span> '+mi(r0.m)+' mi'
                    :'<span class="tag open">none</span>')+
          (S.hand[n]!==undefined?' <button data-useosm="'+esc(n)+'">Clear</button>':'')+
          '</td></tr>'; }).join('')+'</table>';
  }else if(TAB==='suggest'){
    h=R.suggest.length?R.suggest.map(function(s){
      return '<div class="card"><h4>'+esc(s.mine)+'</h4><div class="row">'+
        s.picks.map(function(p){ return '<button data-link="'+esc(s.mine)+'" data-osm="'+esc(p.osm)+
          '">'+esc(p.osm)+' \u00b7 '+mi(p.m)+' mi</button>'; }).join('')+
        '<button data-no="'+esc(s.mine)+'">Not on OSM</button></div></div>'; }).join('')
      :'<table><tr><th>Nothing to suggest.</th></tr></table>';
  }else if(TAB==='missing'){
    var oo=R.extra.map(function(e){ return '<option value="'+esc(e.name)+'">'+esc(e.name)+
      ' \u00b7 '+mi(e.m)+' mi</option>'; }).join('');
    h='<table><tr><th>Your run</th><th>Linked to</th><th></th></tr>'+
      R.missing.map(function(n){
        var al=S.aliases[n], list=al?(Array.isArray(al)?al:[al]):[];
        return '<tr><td>'+esc(n)+'</td><td>'+list.map(function(x){
            return '<button data-rm="'+esc(n)+'" data-one="'+esc(x)+'">'+esc(x)+' \u00d7</button>'; }).join('')+
          '<select data-pick="'+esc(n)+'"><option value="">Link an OSM run\u2026</option>'+oo+'</select>'+
          '</td><td><button data-no="'+esc(n)+'">Not on OSM</button></td></tr>'; }).join('')+'</table>';
  }else if(TAB==='extra'){
    var un={}; R.missing.forEach(function(n){ un[n]=1; });
    var opt=function(n){ return '<option value="'+esc(n)+'">'+esc(n)+'</option>'; };
    var mo=(R.missing.length?'<optgroup label="Unmatched">'+R.missing.map(opt).join('')+'</optgroup>':'')+
      '<optgroup label="All your runs">'+Object.keys(MINE).filter(function(n){return !un[n];})
        .sort().map(opt).join('')+'</optgroup>';
    var showIg=!!window.__SHOWIG, nIg=R.extra.filter(function(r){return S.ignore[r.name];}).length;
    h=(nIg?'<div class="row"><button id="bIg">'+(showIg?'Hide':'Show')+' '+nIg+' ignored</button></div>':'')+
      '<table><tr><th>In OSM, unclaimed</th><th>Rating</th><th class="num">Miles</th><th>Belongs to</th></tr>'+
      R.extra.filter(function(r){ return showIg || !S.ignore[r.name]; })
      .map(function(r){ return '<tr><td>'+esc(r.name)+'</td><td class="mini">'+
        esc(r.diff||'unrated')+'</td><td class="num">'+mi(r.m)+'</td><td>'+
        (function(){
          if(S.ignore[r.name]) return '<span class="mini">ignored</span> '+
            '<button data-unig="'+esc(r.name)+'">Bring back</button>';
          var who=linkedTo(r.name);
          if(S.keep[who]) return '<b>'+esc(who)+'</b><div class="mini">settled \u2014 you kept your '+
            S.hand[who]+' mi</div><button data-unkeep="'+esc(who)+'">Compare again</button>';
          var why=blockedBy(who);
          if(!who) return '<select data-pickosm="'+esc(r.name)+'">'+
                          '<option value="">One of your runs\u2026</option>'+mo+'</select>'+
                          ' <button data-ig="'+esc(r.name)+'">Ignore</button>';
          var why=blockedBy(who);
          return '<b>'+esc(who)+'</b><div class="mini">linked, but '+esc(why||'not resolving yet')+
            '</div>'+(+S.hand[who]>0?'<button data-useosm="'+esc(who)+'">Use OSM instead</button>'+
            ' <button data-keep="'+esc(who)+'">Keep mine</button>':'');
        })()+'</td></tr>'; }).join('')+'</table>';
  }else{
    h='<table><tr><th>Marked not on OSM</th><th></th></tr>'+
      R.skipped.map(function(n){ return '<tr><td>'+esc(n)+'</td><td>'+
        '<input class="pc" style="width:70px;text-align:right" type="number" step="0.01" min="0" '+
        'data-hand="'+esc(n)+'" value="'+(S.hand[n]!==undefined?S.hand[n]:'')+'" placeholder="mi"> '+
        '<button data-un="'+esc(n)+'">Undo</button></td></tr>'; }).join('')+'</table>';
  }
  document.getElementById('out').innerHTML=h;
  document.getElementById('count').textContent=R.rows.length+' of '+tot+' measured';
  wire();
}

function byBase(b){ return R.groups.filter(function(g){return g.base===b;})[0]; }
function refresh(){                                    // recompute WITHOUT the page jumping
  var y=(window.pageYOffset||window.scrollY||0);
  compute();
  try{ if(window.scrollTo) window.scrollTo(0,y); }catch(e){}
}
function linkedTo(osmName){                  // which of his runs already points at this way
  var who=null;
  Object.keys(S.aliases).forEach(function(mine){
    var al=S.aliases[mine], list=Array.isArray(al)?al:[al];
    if(list.some(function(nm){ return tight(nm)===tight(osmName); })) who=mine;
  });
  return who;
}
function blockedBy(mine){                    // why a link on this run is not winning
  if(+S.hand[mine]>0) return 'your typed '+S.hand[mine]+' mi wins';
  if(S.noOsm[mine]) return 'it is marked not on OSM';
  var b=parts(mine).base, sh=S.shares[b];
  if(sh && typeof sh[mine]==='number') return 'a percentage split on '+b+' wins';
  return '';
}
function osmWouldGive(mine){
  var names=[], ids=[];
  var al=S.aliases[mine]; if(al) names=Array.isArray(al)?al.slice():[al];
  Object.keys(S.manual).forEach(function(id){ if(S.manual[id]===mine) ids.push(+id); });
  var m=0, n=0, seen={};
  (RAW||[]).forEach(function(e){
    if(!e.geometry||seen[e.id]) return;
    var g=e.tags||{}, w=g.name||g['piste:name']||'';
    var hit = ids.indexOf(+e.id)>=0 || names.some(function(nm){ return tight(w)===tight(nm); });
    if(!hit) return;
    seen[e.id]=1; n++; m += g['skope:m'] ? +g['skope:m'] : metres(e.geometry);
  });
  return {m:m, n:n, names:names.concat(ids.length?['+'+ids.length+' way you picked']:[])};
}
function overridden(){          // runs where a typed value is silently beating a link
  if(!R) return [];
  return Object.keys(MINE).filter(function(n){ return +S.hand[n]>0 && !S.keep[n]; })
    .map(function(n){ var o=osmWouldGive(n); o.mine=n; return o; })
    .filter(function(o){ return o.n>0; });
}
function link(mine,osm){
  var cur=S.aliases[mine], list=cur?(Array.isArray(cur)?cur.slice():[cur]):[];
  if(list.indexOf(osm)<0) list.push(osm);
  S.aliases[mine]=list.length>1?list:list[0];
  delete S.noOsm[mine]; save(); refresh();
}
function on(sel,ev,fn){ [].forEach.call(document.querySelectorAll(sel),function(el){
  el.addEventListener(ev,function(){ fn(el); }); }); }

function wire(){
  on('input[data-hand]','change',function(el){
    var n=el.getAttribute('data-hand'), v=parseFloat(el.value);
    if(el.value===''||isNaN(v)||v<=0) delete S.hand[n]; else S.hand[n]=v;
    save(); refresh(); });
  on('#q','input',function(el){ window.__Q=el.value; });
  on('#q','change',function(el){ window.__Q=el.value; render();
    var f=document.getElementById('q'); if(f) f.focus(); });
  on('select[data-way]','change',function(el){
    var id=el.getAttribute('data-way');
    if(el.value) S.manual[id]=el.value; else delete S.manual[id];
    var card=el.closest?el.closest('.card'):null;
    var body=card?card.querySelector('[data-body]'):null;
    if(body) EXPAND[body.getAttribute('data-body')]=1;
    save(); refresh(); });
  on('[data-show]','click',function(el){
    var base=el.getAttribute('data-show');
    EXPAND[base]=1;
    var b=document.querySelector('[data-body="'+base+'"]');
    if(b) b.style.display=''; el.style.display='none'; });
  on('[data-split]','click',function(el){
    var base=el.getAttribute('data-split'), g=byBase(base), o={}, tot=0;
    [].forEach.call(document.querySelectorAll('[data-pc="'+base+'"]'),function(inp){
      var v=inp.value===''?Math.round(100/g.segs.length):+inp.value;
      o[inp.getAttribute('data-seg')]=v; tot+=v; });
    if(Math.abs(tot-100)>1.5){ say('Those add up to '+tot+'%, not 100.',true); return; }
    S.shares[g.base]=o; EXPAND[g.base]=1; save(); refresh(); });
  on('[data-clear]','click',function(el){
    var g=byBase(el.getAttribute('data-clear'));
    delete S.shares[g.base];
    g.pool.forEach(function(w){ delete S.manual[w.id]; });
    EXPAND[g.base]=1; save(); refresh(); });
  on('[data-link]','click',function(el){ link(el.getAttribute('data-link'),el.getAttribute('data-osm')); });
  on('select[data-pick]','change',function(el){ if(el.value) link(el.getAttribute('data-pick'),el.value); });
  on('select[data-pickosm]','change',function(el){ if(el.value) link(el.value,el.getAttribute('data-pickosm')); });
  on('[data-rm]','click',function(el){
    var mine=el.getAttribute('data-rm'), one=el.getAttribute('data-one'), cur=S.aliases[mine];
    var list=(Array.isArray(cur)?cur:[cur]).filter(function(x){return x!==one;});
    if(list.length) S.aliases[mine]=list.length>1?list:list[0]; else delete S.aliases[mine];
    save(); refresh(); });
  on('[data-useosm]','click',function(el){
    var n=el.getAttribute('data-useosm'); delete S.hand[n]; delete S.keep[n]; save(); refresh(); });
  on('[data-keep]','click',function(el){ S.keep[el.getAttribute('data-keep')]=1; save(); refresh(); });
  on('[data-ig]','click',function(el){ S.ignore[el.getAttribute('data-ig')]=1; save(); refresh(); });
  on('[data-unig]','click',function(el){ delete S.ignore[el.getAttribute('data-unig')]; save(); refresh(); });
  on('#bIg','click',function(){ window.__SHOWIG=!window.__SHOWIG; render(); });
  on('[data-unkeep]','click',function(el){ delete S.keep[el.getAttribute('data-unkeep')]; save(); refresh(); });
  on('[data-no]','click',function(el){ S.noOsm[el.getAttribute('data-no')]=1; save(); refresh(); });
  on('[data-un]','click',function(el){ delete S.noOsm[el.getAttribute('data-un')]; save(); refresh(); });
}

/* ---- controls ------------------------------------------------------------ */
document.getElementById('bRaw').href=EP[0]+'?data='+encodeURIComponent(Q);
document.getElementById('bFetch').addEventListener('click',fetchOSM);
document.getElementById('bPaste').addEventListener('click',function(){
  var p=document.getElementById('pastebox');
  p.style.display=(p.style.display==='block')?'none':'block'; });
document.getElementById('bLoad').addEventListener('click',function(){
  try{ ingest(JSON.parse(document.getElementById('pasteText').value),'your paste'); }
  catch(e){ say('That did not parse as JSON: '+e.message,true); } });
document.getElementById('bCache').addEventListener('click',function(){ useCache(true); });
document.getElementById('bReset').addEventListener('click',function(){
  try{ localStorage.removeItem(KEY); localStorage.removeItem(CKEY); }catch(e){}
  S={aliases:{},noOsm:{},manual:{},shares:{},hand:{},keep:{},ignore:{},afix:AFIX_V};
  SEED_IG.forEach(function(k){ S.ignore[k]=1; });
  Object.keys(SEED_A).forEach(function(k){ S.aliases[k]=SEED_A[k]; });
  Object.keys(AFIX).forEach(function(k){ S.aliases[k]=AFIX[k]; });
  SEED_N.forEach(function(k){ S.noOsm[k]=1; });
  save(); if(RAW) compute(); else render();
  say('Saved data cleared and reset to the seed links.'); });
document.getElementById('bExport').addEventListener('click',function(){
  if(!R){ say('Nothing to export yet.',true); return; }
  var out={v:10,source:'OpenStreetMap via Overpass, ODbL',when:new Date().toISOString(),
    note:'plan distance in miles, not slope distance. A split run is measured per segment.',
    len_mi:{},method:{},still_open:R.groups.filter(function(g){return g.pool.length&&isOpen(g);})
      .map(function(g){return g.segs.map(function(s){return s.mine;});}),
    unmatched:R.missing,not_on_osm:R.skipped,aliases:S.aliases,shares:S.shares,
    measured_by_hand:S.hand,
    osm_only:R.extra.map(function(e){return e.name;}),
    accounted:R.rows.length+R.missing.length+R.skipped.length+
      R.groups.filter(function(g){return g.pool.length&&isOpen(g);})
       .reduce(function(a,g){return a+g.segs.filter(function(s){
         return !R.rows.some(function(x){return x.mine===s.mine;});}).length;},0),
    of:Object.keys(MINE).length};
  R.rows.forEach(function(r){ out.len_mi[r.mine]=+mi(r.m); out.method[r.mine]=r.method; });
  document.getElementById('exportText').value=JSON.stringify(out,null,1);
  var d=document.getElementById('dlg');
  if(d.showModal) d.showModal(); else d.setAttribute('open','open'); });
document.getElementById('bCopy').addEventListener('click',function(){
  var t=document.getElementById('exportText'); t.select(); document.execCommand('copy'); });
document.getElementById('bClose').addEventListener('click',function(){
  var d=document.getElementById('dlg');
  if(d.close) d.close(); else d.removeAttribute('open'); });

drawTabs();
if(!useCache(false)) say('Ready. Press fetch, or use "Open query in a tab" and paste the result.');
</script></body></html>
